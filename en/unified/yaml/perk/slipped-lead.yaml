content: You gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made to escape bonds. Given 1 uninterrupted minute, you can escape any mundane bonds without making a [test](scc.v1:mcdm.heroes.v1/rule.test/test). Additionally, it's not immediately obvious when you've escaped bonds until you do something that makes it clear you have done so (cast them off, use an ability that harms one or more creatures, and so forth).
