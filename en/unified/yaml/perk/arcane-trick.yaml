content: "You have the following ability.\n\n> ###### Arcane Trick\n>\n> *You cast an entertaining spell that creates a minor but impressive magical effect.*\n>\n> | **Magic**              | **[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n> |------------------------|----------------:|\n> | **\U0001F4CF Self; see below** |     **\U0001F3AF Self** |\n>\n> **Effect:** Choose one of the following effects:\n>\n> - You [teleport](scc.v1:mcdm.heroes.v1/movement/teleport) a [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1S or smaller object [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you into an unoccupied space [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you.\n> - Until the start of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), a part of your body shoots a shower of harmless noisy sparks that light up each square [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you.\n> - You ignite or snuff out (your choice) every mundane light source of 1L or smaller [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you.\n> - You transform up to 1 pound of edible food you touch to make it taste delicious or disgusting.\n> - Until the start of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you make your body exude a particular odor you've smelled before. This smell can be sensed by each creature within 5 squares of you, but can't impose any [condition](scc.v1:mcdm.heroes.v1/rule.combat/condition) or other drawback on those creatures.\n> - You place a small magical inscription on the surface of a mundane object you touch, or you can remove an inscription that was made by you or by another creature using [Arcane Trick](scc.v1:mcdm.heroes.v1/perk/arcane-trick).\n> - You touch a [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1T object to cover it with an illusion that makes it look like a different object. Any creature who handles the object becomes aware of the illusion. The illusion ends when you stop touching the object."
flavor: You have the following ability.
name: Arcane Trick
scc: mcdm.heroes.v1/perk/arcane-trick
type: perk
