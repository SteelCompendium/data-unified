content: As a maneuver, you grab a willing [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) ally or object of your [size](scc.v1:mcdm.heroes.v1/rule.character/size) or smaller, then vertical [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) that target up to a number of squares equal to twice your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score. If a creature you [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) falls as a result of this movement, the effective [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of the fall is reduced by a number of squares equal to twice your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score. When you use this perk, you can't use it again until you earn 1 or more [Victories](scc.v1:mcdm.heroes.v1/rule.resource/victories).
flavor: As a maneuver, you grab a willing adjacent ally or object of your size or smaller, then vertical push that target up to a number of squares equal to twice your Might score. If a creature you push falls as a result of this movement, the effective distance of the fall is reduced by a number of squares equal to twice your Might score. When you use this perk, you can't use it again until you earn 1 or more Victories.
name: Friend Catapult
scc: mcdm.heroes.v1/perk/friend-catapult
type: perk
