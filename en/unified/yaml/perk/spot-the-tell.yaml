content: Whenever you make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) to read a person and obtain a tier 3 outcome, you notice several tells that give away their true feelings. Any [test](scc.v1:mcdm.heroes.v1/rule.test/test) you make to read that person in the future gains an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge).
