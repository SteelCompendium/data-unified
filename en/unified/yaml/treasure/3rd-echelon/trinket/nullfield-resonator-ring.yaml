content: "*This simple band of copper vibrates slightly when handled.*\n\n**Keywords:** Psionic, Ring\n\n**[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** A wafer of gallium arsenide\n\n**[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** Texts or lore in Mindspeech\n\n**[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)\n\n**Project Goal:** 450\n\n**Effect:** You must be a [null](scc.v1:mcdm.heroes.v1/class/null) to wear this ring. While you do so, the area of your [Null Field](scc.v1:mcdm.heroes.v1/feature.null.level-1/null-field) ability increases by 1.\n\nAdditionally, you have the following ability.\n\n###### Nullring Strike\n\n>\n> *Your punch delivers a devastating burst of psionic energy.*\n>\n> | **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), Psionic**, **Strike, Weapon** |               **Main action** |\n> |----------------------------------------|------------------------------:|\n> | **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**                         | **\U0001F3AF One creature or object** |\n>\n> **[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc.v1:mcdm.heroes.v1/rule.character/might) or [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility):**\n>\n> - **≤11:** 3 psychic damage\n> - **12-16:** 5 psychic damage; I < AVERAGE, [slowed](scc.v1:mcdm.heroes.v1/condition/slowed) (save ends)\n> - **17+:** 8 psychic damage; I < STRONG, [slowed](scc.v1:mcdm.heroes.v1/condition/slowed) (save ends)\n>\n> **Effect:** While [slowed](scc.v1:mcdm.heroes.v1/condition/slowed) in this way, the target takes a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on magic or psionic abilities."
echelon: "3"
