content: Areas of thick underbrush, rubble, spiderwebs, or other obstacles to movement create [difficult terrain](scc.v1:mcdm.heroes.v1/movement/difficult-terrain). It costs 1 additional square of movement to enter a square of [difficult terrain](scc.v1:mcdm.heroes.v1/movement/difficult-terrain).
name: Difficult Terrain
