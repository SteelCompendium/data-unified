content: |-
    Boring stuff like opening an unlocked door, picking up an arrow from the ground, giving an object to an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) ally, or drawing a weapon doesn't require a maneuver or a main action. Rather, you can undertake such straightforward activities as free maneuvers on your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn). A free maneuver follows the same rules as a regular maneuver, but you can typically take as many free maneuvers as you like.

    At the Director's discretion, circumstances could make something that is typically boring more impactful and exciting. For instance, if you need to pick a magic arrow up off the ground during a violent earthquake, what would otherwise be a free maneuver could require a maneuver or a main action to accomplish.

    Likewise, the nature of an activity might make it too complicated for a free maneuver. For example, picking up the body of an unconscious [talent](scc.v1:mcdm.heroes.v1/class/talent) ally to carry them to safety can probably be done as a free maneuver. But if your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) is lacking and you need to pick up a [tactician](scc.v1:mcdm.heroes.v1/class/tactician) ally decked out in the [Shining Armor](scc.v1:mcdm.heroes.v1/kit/shining-armor) kit, the Director might determine that you need to use a regular maneuver to hoist their armored form over your shoulders.

    Any effect that prevents you from using maneuvers also prevents you from using free maneuvers.
name: Free Maneuvers
scc: mcdm.heroes.v1/rule.combat/free-maneuver
type: rule
