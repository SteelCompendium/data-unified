content: |-
    Some abilities, treasures, and other effects grant a creature temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina). Temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) shouldn't be included in a creature's [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) total when figuring out a creature's [recovery value](scc.v1:mcdm.heroes.v1/rule.health/recoveries) or [winded](scc.v1:mcdm.heroes.v1/rule.health/winded) value. If you have temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) while [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), [dying](scc.v1:mcdm.heroes.v1/rule.health/dying), or dead, the temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) doesn't change those states.

    Whenever you take damage while you have temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), the temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) decreases first, and any leftover damage is applied to your [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) as usual. For instance, if you have 10 temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) and take 16 damage, you lose the temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) and then lose another 6 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina).

    There is no maximum to how much temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) you can have. Regaining [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) can't restore temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina). If you have temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) and then gain more temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), you get whichever amount of temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) is greater, rather than adding the two pools together. For instance, if an ability grants you 10 temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) when you already have 5, you have 10 temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), not 15.

    Unless otherwise indicated, temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) disappears at the end of an encounter.
name: Temporary Stamina
scc: mcdm.heroes.v1/rule.health/temporary-stamina
type: rule
