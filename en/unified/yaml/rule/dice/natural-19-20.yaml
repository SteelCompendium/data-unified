content: Whenever you get a natural 19 or 20 on the [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) for a [test](scc.v1:mcdm.heroes.v1/rule.test/test)—a total of 19 or 20 before adding your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) score or other modifiers you score a critical success. This critical success automatically lets you succeed on the task with a reward, even if the [test](scc.v1:mcdm.heroes.v1/rule.test/test) has a medium or hard difficulty.
name: 'Natural 19 or 20: Success With a Reward'
scc: mcdm.heroes.v1/rule.dice/natural-19-20
type: rule
