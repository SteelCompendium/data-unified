content: |-
    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s patience represents how much time and effort they're willing to devote to a negotiation. Patience is graded on a scale of 0 to 5, with each [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) starting a negotiation with their patience higher than 0. If an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s patience reaches 0, the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) makes a final offer and negotiation ends (see Keep Going or Stop).

    Patience can decrease each time the heroes make an argument during a negotiation.

    ##### Language and Patience

    If one or more heroes negotiating with an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) can communicate in the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s native language (not including Caelian), then the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s patience increases by 1 at the start of the negotiation (to a maximum of 5). If three or more heroes negotiating with an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) can communicate in the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s native language, the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s patience increases by 2 (to a maximum of 5). Chapter 4: [Background](scc.v1:mcdm.heroes.v1/chapter/background) has information on some of the languages in the game.
