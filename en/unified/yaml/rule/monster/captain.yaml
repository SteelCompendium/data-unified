content: "Any non-[Mount](scc.v1:mcdm.monsters.v1/rule.role/mount), non-minion creature, who speaks a language that a [squad](scc.v1:mcdm.monsters.v1/rule.monster/squad) of [minions](scc.v1:mcdm.monsters.v1/rule.organization/minion) can understand can be attached to that squad as a captain. Captains aren't necessarily strategic leaders with brilliant tactics. Sometimes they're just powerful creatures who bully, inspire, or have some supernatural influence that drives other creatures to action.\n\nA squad of minions can have only one captain, and a creature can't be captain to more than one squad of minions.\n\n##### Separate Actions and Stamina\n\nA [captain](scc.v1:mcdm.monsters.v1/rule.monster/captain) takes their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) at the same time as the minion members of their [squad](scc.v1:mcdm.monsters.v1/rule.monster/squad) but isn't limited in their action options as minions are. A captain's [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) isn't added to a minion squad's Stamina pool, and is tracked as for any other creature in combat.\n\n##### Captain Benefits\n\nWhile a minion [squad](scc.v1:mcdm.monsters.v1/rule.monster/squad) has a [captain](scc.v1:mcdm.monsters.v1/rule.monster/captain), each minion in the squad gains the benefits noted at the \"With Captain\" entry on their stat block. Usually, this benefit is either a damage boost, a bonus to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed), or additional [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina).\n\n##### I Am the Captain Now\n\nIf a [squad](scc.v1:mcdm.monsters.v1/rule.monster/squad) of [minions](scc.v1:mcdm.monsters.v1/rule.organization/minion) loses their [captain](scc.v1:mcdm.monsters.v1/rule.monster/captain), a new allied creature can become that squad's captain at the start of the next [round](scc.v1:mcdm.heroes.v1/rule.combat/combat-round) (no action required).\n\n> **Stat Block Icons**\n> \n> The stat blocks in this book contain multiple different icons that allow quick scanning for just the right trait or ability for the situation. The following list provides examples of the most common icons you'll come across.\n> \n> - \U0001F4CF The **distance** of the ability\n> - \U0001F3AF The **targets** or affected area of the ability\n> - ⭐️ A **trait** of the creature, often a feature that is always in effect\n> - \U0001F5E1 A **melee** ability\n> - \U0001F3F9 A **ranged** ability\n> - ⚔️ An ability that is **melee** or **ranged** (your choice)\n> - \U0001F464 A **self** ability that only targets the user\n> - \U0001F533 A **cube**, **line**, or **wall** area ability\n> - ❇️ An **aura** or **burst** area ability\n> - \U0001F300 A **special** ability with a unique distance, often the entire encounter map\n> - ❗️ A **[triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action)**\n> - ☠️ A feature or ability specific to a [leader](scc.v1:mcdm.monsters.v1/rule.organization/leader) or [solo](scc.v1:mcdm.monsters.v1/rule.organization/solo) creature, such as **[villain actions](scc.v1:mcdm.monsters.v1/rule.monster/villain-action)**"
name: Attached Squad Captain
scc: mcdm.monsters.v1/rule.monster/captain
type: rule
