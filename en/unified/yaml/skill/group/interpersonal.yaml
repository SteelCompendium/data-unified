content: |-
    Skills from the interpersonal skill group are used to socially interact with other creatures, and are particularly useful during negotiations (see Chapter 11: [Negotiation](scc.v1:mcdm.heroes.v1/chapter/negotiation)). Aside from the [Handle Animals](scc.v1:mcdm.heroes.v1/skill.interpersonal/handle-animals) skill, you can generally only use interpersonal skills when you attempt to influence creatures who have emotions and who can understand you.

    Rewards for [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made with interpersonal skills typically include gaining an extra favor, item, or piece of information from the people or creatures you interact with.

    Consequences for [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made with interpersonal skills include making the creature you're interacting with angry, sad, embarrassed, offended, or otherwise upset or uncomfortable. This might cause them to ignore you, storm off, spread rumors about you, attack you, betray you, blackmail you, or otherwise attempt to harm you.

    ###### Interpersonal Skills Table

    | Skill          | Use                                                                     |
    |----------------|-------------------------------------------------------------------------|
    | Brag           | Impress others with stories of your deeds                               |
    | Empathize      | Relate to someone on a personal level                                   |
    | Flirt          | Attract romantic attention from someone                                 |
    | Gamble         | Make bets with others                                                   |
    | Handle Animals | Interact with nonsapient animal wildlife                                |
    | Interrogate    | Obtain information from a creature withholding it                       |
    | Intimidate     | Awe or scare a creature                                                 |
    | Lead           | Inspire people to action                                                |
    | Lie            | Convince someone that a falsehood is true                               |
    | Music          | Perform music vocally or with an instrument                             |
    | Perform        | Engage in dance, oratory, acting, or some other physical performance    |
    | Persuade       | Convince someone to agree with you through use of your charms and grace |
    | Read Person    | Read the emotions and body language of other creatures                  |
name: Interpersonal Skills
