benefit: 'You have a [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) possession—a 1st-[echelon](scc.v1:mcdm.heroes.v1/rule.general/echelon) [trinket](scc.v1:mcdm.heroes.v1/rule.treasure/trinket) of your choice (see Treasures in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards)) that might have some connection with your former life.'
content: |-
    You have no memory of your past before the... incident. Hopefully, you'll regain your memory soon and find out what the incident was. In the meantime, you need friends so you won't be alone when your past catches up to you.

    **Benefit:** You have a [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) possession—a 1st-[echelon](scc.v1:mcdm.heroes.v1/rule.general/echelon) [trinket](scc.v1:mcdm.heroes.v1/rule.treasure/trinket) of your choice (see Treasures in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards)) that might have some connection with your former life.

    **Drawback:** You take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on any [test](scc.v1:mcdm.heroes.v1/rule.test/test) made to recall lore.
drawback: You take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on any [test](scc.v1:mcdm.heroes.v1/rule.test/test) made to recall lore.
