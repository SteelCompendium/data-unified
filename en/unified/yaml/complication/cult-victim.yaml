benefit: Once per [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you can move through solid matter 1 square thick or less. If you end your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) inside solid matter, you are forced out into the space from which you entered it and you take 5 damage that can't be reduced in any way.
content: |-
    Cultists captured you while raiding your home, then began an unholy ritual to [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) your body into an undead spirit. Though the ritual failed, your body became infused with corrupted magic, turning you partially incorporeal.

    **Benefit:** Once per [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you can move through solid matter 1 square thick or less. If you end your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) inside solid matter, you are forced out into the space from which you entered it and you take 5 damage that can't be reduced in any way.

    **Drawback:** You have corruption weakness 5.
drawback: You have corruption weakness 5.
