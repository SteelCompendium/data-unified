          tier3: 10 acid damage; M < 2 [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding) (save ends)
        - effect: A creature [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to the target can attempt an **Agility test** as a maneuver to remove the detonator.
