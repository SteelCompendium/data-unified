features:
    - body: Ajax automatically treats his initial power roll as a 17. He can still roll to determine if he scores a critical hit.
      icon: ⭐️
      name: Insurgent
    - body: Before he uses an ability, Ajax can either [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to 2 squares, or can cause one creature within line of effect to [slide](scc.v1:mcdm.heroes.v1/movement/forced-movement) up to 2 squares, ignoring stability.
      icon: ⭐️
      name: Mastermind
    - body: Ajax has [damage immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) 5. Additionally, any enemy who makes a power roll that includes Ajax as a target has a double [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on the roll.
      icon: ⭐️
      name: Vanguard
flavor: 'At the start of each round, Ajax chooses a new stance from one of the following options and gains its benefits:'
kind: feature
metadata:
    scc: mcdm.monsters.v1/monster.ajax-the-invincible/tactical-stance
    source: mcdm.monsters.v1
name: Tactical Stance
type: featureblock
