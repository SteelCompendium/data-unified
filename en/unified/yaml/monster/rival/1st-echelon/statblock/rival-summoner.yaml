      distance: Ranged 10
      effects:
        - roll: 2d10 + 2
          tier1: 5 corruption damage
          tier2: 8 corruption damage
          tier3: 11 corruption damage; R < 2 [slowed](scc.v1:mcdm.heroes.v1/condition/slowed) (save ends)
      feature_type: ability
