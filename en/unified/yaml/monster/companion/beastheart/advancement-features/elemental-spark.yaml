features:
    - body: Whenever the spark makes a strike against a creature while rampaging, they can cause a target who has M < AVERAGE to be [dazed](scc.v1:mcdm.heroes.v1/condition/dazed) until the end of the target's next turn.
      level: 3
      name: Electroshock
    - body: While the spark is rampaging, lightning sings through your blood, and whenever you make a strike against a creature, you deal extra lightning damage equal to your Might score.
      level: 6
      name: Conductive
    - body: While the spark is rampaging, you and the spark can [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to your speed as a free maneuver once on each of your turns.
      level: 10
      name: Lightning Speed
