ability:
    distance: Self
    effects:
        - roll: Power Roll + [Might](scc.v1:mcdm.heroes.v1/rule.character/might) or [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility)
          tier1: No effect.
          tier2: You can escape the grab, but if you do, a creature who has you [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) can make a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against you before you are no longer [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).
          tier3: You are no longer [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).
        - effect: You take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on this maneuver if your [size](scc.v1:mcdm.heroes.v1/rule.character/size) is smaller than the size of the creature, object, or effect that has you [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).
          name: Effect
    feature_type: ability
    keywords: []
    metadata:
        action_type: Maneuver
        content: "\n| **-**       | **Maneuver** |\n|-------------|-------------:|\n| **\U0001F4CF Self** |  **\U0001F3AF Self** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc.v1:mcdm.heroes.v1/rule.character/might) or [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility):**\n\n- **≤11:** No effect.\n- **12-16:** You can escape the grab, but if you do, a creature who has you [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) can make a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against you before you are no longer [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).\n- **17+:** You are no longer [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).\n\n**Effect:** You take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on this maneuver if your [size](scc.v1:mcdm.heroes.v1/rule.character/size) is smaller than the size of the creature, object, or effect that has you [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).\n\nSee [Conditions](scc.v1:mcdm.heroes.v1/rule.combat/condition) in Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes) for information on the [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) [condition](scc.v1:mcdm.heroes.v1/rule.combat/condition)."
        distance: Self
        feature_type: ability
        item_id: escape-grab
        item_name: Escape Grab
        keywords: []
        target: Self
        type: feature/ability/common
    name: Escape Grab
    target: Self
    type: feature
    usage: Maneuver
effects:
    - effect: A creature who is [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) by another creature, an object, or an effect (see [Grab](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/grab) below) can attempt to escape by using the following ability.
feature_type: feature
metadata:
    action_type: feature
    feature_type: feature
    item_id: escape-grab
    item_name: Escape Grab
    scc:
        - mcdm.heroes.v1/feature.common.maneuvers/escape-grab
    type: feature/common/maneuvers
name: Escape Grab
type: feature
