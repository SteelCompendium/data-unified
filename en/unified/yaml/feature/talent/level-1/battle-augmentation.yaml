effects:
    - effect: |-
        You can wear light armor and wield light weapons effectively, even though you don't have a kit. While you wear light armor, you gain a +3 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), and that [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) increases by 3 at 4th, 7th, and 10th levels. While you wield a light weapon, you gain a +1 damage [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) with weapon abilities, including [free strikes](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike). You can use light armor treasures and light weapon treasures.

        If you have a kit, you can't take this augmentation.
feature_type: feature
