effects:
    - effect: 'You know the Mindspeech language (see Languages in [Orden](scc.v1:mcdm.heroes.v1/rule.world/orden) in Chapter 4: [Background](scc.v1:mcdm.heroes.v1/chapter/background)). Additionally, you can telepathically communicate with any creatures within [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of your [Mind Spike](scc.v1:mcdm.heroes.v1/feature.ability.talent.level-1/mind-spike) ability if they share a language with you and you know of each other. When you communicate with someone this way, they can respond telepathically.'
