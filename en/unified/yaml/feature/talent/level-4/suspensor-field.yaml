effects:
    - effect: |-
        You can [fly](scc.v1:mcdm.heroes.v1/movement/fly). While [flying](scc.v1:mcdm.heroes.v1/movement/fly), your [stability](scc.v1:mcdm.heroes.v1/rule.character/stability) is reduced to 0 and can't be increased. If you can already [fly](scc.v1:mcdm.heroes.v1/movement/fly), you have a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) while [flying](scc.v1:mcdm.heroes.v1/movement/fly) instead.

        If you are strained while [flying](scc.v1:mcdm.heroes.v1/movement/fly) and are force moved, the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) gains a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties).
