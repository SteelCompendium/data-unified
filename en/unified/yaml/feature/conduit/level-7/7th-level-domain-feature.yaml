effects:
    - effect: |-
        Choose one of your domains. You gain a domain feature for that domain, as shown on the 7th-Level [Conduit](scc.v1:mcdm.heroes.v1/class/conduit) Domain Features table.

        ###### 7th-Level Conduit Domain Features Table

        | Domain     | Feature                      |
        |------------|------------------------------|
        | Creation   | [Divine Quartermaster](scc.v1:mcdm.heroes.v1/feature.censor.level-7/divine-quartermaster)         |
        | Death      | [Word of Death Deferred](scc.v1:mcdm.heroes.v1/feature.censor.level-7/word-of-death-deferred)       |
        | Fate       | [Word of Fate Denied](scc.v1:mcdm.heroes.v1/feature.censor.level-7/word-of-fate-denied)          |
        | Knowledge  | Gods' Library                |
        | Life       | [Font of Grace](scc.v1:mcdm.heroes.v1/feature.censor.level-7/font-of-grace)                |
        | Love       | [Covenant of the Heart](scc.v1:mcdm.heroes.v1/feature.censor.level-7/covenant-of-the-heart)        |
        | Nature     | Nature's Bounty              |
        | Protection | [Blessing of Iron](scc.v1:mcdm.heroes.v1/feature.censor.level-7/blessing-of-iron)             |
        | Storm      | [Thunderstruck](scc.v1:mcdm.heroes.v1/feature.conduit.level-7/thunderstruck)                |
        | Sun        | [Light of the Burning Sun](scc.v1:mcdm.heroes.v1/feature.censor.level-7/light-of-the-burning-sun)     |
        | Trickery   | [Trinity of Trickery](scc.v1:mcdm.heroes.v1/feature.ability.censor.level-7/trinity-of-trickery)          |
        | War        | [Your Triumphs Are Remembered](scc.v1:mcdm.heroes.v1/feature.censor.level-7/your-triumphs-are-remembered) |
