effects:
    - effect: As a [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) activity, you summon a willing and not-[restrained](scc.v1:mcdm.heroes.v1/condition/restrained) [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) or player ally to join your party, regardless of [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) or manifold. The target stays until the start of your next [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) or until they are killed, in which they are immediately dismissed to the place from which they were summoned. You can't have more than one character summoned in this way.
