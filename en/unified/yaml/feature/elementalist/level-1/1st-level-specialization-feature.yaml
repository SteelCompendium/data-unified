        Your [elemental specialization](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/elemental-specialization) grants you a feature, as shown on the 1st-Level [Elemental Specialization](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/elemental-specialization) Features table.

        ###### 1st-Level Elemental Specialization Features Table

        | Specialization | Feature                    |
        |----------------|----------------------------|
        | Earth          | [Motivate Earth](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/motivate-earth)             |
        | Fire           | [Return to Formlessness](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/return-to-formlessness)     |
        | Green          | [It Is the Soul Which Hears](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/it-is-the-soul-which-hears) |
        | Void           | [A Beyonding of Vision](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/a-beyonding-of-vision)      |
