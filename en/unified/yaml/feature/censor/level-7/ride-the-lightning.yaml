effects:
    - effect: Lightning and thunder infuse your body. Whenever you use an ability to deal [rolled damage](scc.v1:mcdm.heroes.v1/rule.damage/rolled-damage) to another creature, the ability deals extra lightning damage equal to your [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) score. Additionally, if you use an ability that force moves a creature, the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) gains a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) equal to your [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) score. While you are under the effect of your [Windwalk](scc.v1:mcdm.heroes.v1/feature.censor.level-4/windwalk) feature, lightning enhances your locomotion to grant you a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) equal to your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score. If [Windwalk](scc.v1:mcdm.heroes.v1/feature.censor.level-4/windwalk) already grants you a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed), this [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) adds to that.
