effects:
    - effect: You have learned to leverage your marked foes' psychology and goad them into acting before they're tactically ready. Whenever a creature marked by you uses a [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) that targets you or any ally within your [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect), you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to change one target of the [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) to you or another ally within your [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect). The new target must be within [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of the ability and within [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect) of the creature using it.
feature_type: feature
