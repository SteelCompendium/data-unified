effects:
    - effect: You have advanced your skills in subterfuge, now directing full battlefield strategy and logistics. During a [montage test](scc.v1:mcdm.heroes.v1/rule.test/montage-test) or negotiation, you can obtain one automatic success on a [test](scc.v1:mcdm.heroes.v1/rule.test/test) made using a skill from the [intrigue skill group](scc.v1:mcdm.heroes.v1/skill.group/intrigue). Additionally, you can use skills from the [intrigue skill group](scc.v1:mcdm.heroes.v1/skill.group/intrigue) to conceal large groups of people, such as escaping civilians and groups of guerilla warriors.
