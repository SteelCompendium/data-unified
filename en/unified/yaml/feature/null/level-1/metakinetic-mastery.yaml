effects:
    - effect: |-
        Whenever you use your [Inertial Shield](scc.v1:mcdm.heroes.v1/feature.ability.null.level-1/inertial-shield) ability, you can then use the [Knockback](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuver as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action).

        Additionally, as your discipline grows, your psionic potential is amplified, granting benefits from the [Metakinetic Mastery](scc.v1:mcdm.heroes.v1/feature.null.level-1/metakinetic-mastery) table. Benefits are cumulative except where an improved benefit replaces a lesser benefit.

        ###### Metakinetic Mastery Table

        | Discipline      | Benefit                                                                                                                                                                                     |
        |-----------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
        | 2               | Whenever you use the [Knockback](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuver, the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) gains a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) equal to your [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score.                                                                          |
        | 4               | The first time in a [combat round](scc.v1:mcdm.heroes.v1/rule.combat/combat-round) that you take damage or are [force moved](scc.v1:mcdm.heroes.v1/movement/forced-movement), you gain 1 [surge](scc.v1:mcdm.heroes.v1/rule.resource/surge), even if you resist the effect.                                                                  |
        | 6               | You gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on the [Grab](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/grab) and [Knockback](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuvers.                                                                                                                                       |
        | 8 (4th level)   | The first time in a [combat round](scc.v1:mcdm.heroes.v1/rule.combat/combat-round) that you take damage or are [force moved](scc.v1:mcdm.heroes.v1/movement/forced-movement), you gain 2 [surges](scc.v1:mcdm.heroes.v1/rule.resource/surge), even if you resist the effect.                                                                 |
        | 10 (7th level)  | You have a double [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on the [Grab](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/grab) and [Knockback](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuvers.                                                                                                                                 |
        | 12 (10th level) | Whenever you force move a target, the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) gains a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) equal to your [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score. Additionally, whenever you use a [heroic ability](scc.v1:mcdm.heroes.v1/rule.general/heroic-ability), you gain 10 [temporary Stamina](scc.v1:mcdm.heroes.v1/rule.health/temporary-stamina). |
