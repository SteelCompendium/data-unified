effects:
    - effect: You can use all [stormwight kits](scc.v1:mcdm.heroes.v1/feature.fury.stormwight-kits/kit-features). During a [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite), you can choose to swap your stormwight kit and still take another [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) activity. Your Nature's Knight feature now lets you automatically sense the presence of animals within 1 mile of you. Additionally, whenever you make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) to track another creature, you can roll three dice and choose which two to use.
