effects:
    - effect: Whenever you use [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) to [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) a creature, you can [pull](scc.v1:mcdm.heroes.v1/movement/forced-movement) that creature instead. Whenever you [pull](scc.v1:mcdm.heroes.v1/movement/forced-movement) a creature [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you and that creature has M < AVERAGE, you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to make that creature [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) by you.
