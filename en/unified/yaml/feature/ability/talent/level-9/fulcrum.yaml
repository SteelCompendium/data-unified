cost: 11 Clarity
distance: Special
effects:
    - effect: Make a [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) to determine the area of this ability. Each target is vertical [pushed](scc.v1:mcdm.heroes.v1/movement/forced-movement) 6 squares. You can target only objects of [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1L or smaller.
      name: Effect
    - roll: Power Roll + [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason)
      tier1: 2 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)
      tier2: 3 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)
      tier3: 4 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)
    - effect: You can choose to reduce the size of the [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst) by 2 (to a minimum of 1 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)) to give the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties). You take half the total damage all targets take from [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement).
      name: Strained
feature_type: ability
flavor: You precisely manipulate the creatures around you.
keywords:
    - Area
    - Psionic
    - Telekinesis
metadata:
    action_type: '[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)'
    class: talent
    content: "\n*You precisely manipulate the creatures around you.*\n\n| **Area, Psionic, Telekinesis** |                          **[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|--------------------------------|-----------------------------------------:|\n| **\U0001F4CF Special**                 | **\U0001F3AF Each enemy and object in the area** |\n\n**Effect:** Make a [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) to determine the area of this ability. Each target is vertical [pushed](scc.v1:mcdm.heroes.v1/movement/forced-movement) 6 squares. You can target only objects of [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1L or smaller.\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason):**\n\n- **≤11:** 2 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)\n- **12-16:** 3 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)\n- **17+:** 4 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)\n\n**Strained:** You can choose to reduce the size of the [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst) by 2 (to a minimum of 1 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)) to give the [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties). You take half the total damage all targets take from [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement)."
