    content: "\n*Dirt and debris swirl into a dark, pulsing hurricane.*\n\n| **Area, Earth, Magic, [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)** |               **Main action** |\n|--------------------------------|------------------------------:|\n| **\U0001F4CF 4 [cube](scc.v1:mcdm.heroes.v1/rule.combat/cube) within 10**        | **\U0001F3AF Each enemy in the area** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason):**\n\n- **≤11:** 2 damage\n- **12-16:** 5 damage\n- **17+:** 7 damage\n\n**Effect:** The area lasts until the start of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn). It is [difficult terrain](scc.v1:mcdm.heroes.v1/movement/difficult-terrain) for enemies, and you and your allies have [concealment](scc.v1:mcdm.heroes.v1/rule.combat/concealment) while in the area.\n\n**Persistent 1:** The area remains until the start of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), and you can move it up to 5 squares (no action required). As a maneuver, you can make the [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) again without spending essence."
