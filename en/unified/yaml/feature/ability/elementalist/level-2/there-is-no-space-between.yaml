distance: '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10'
effects:
    - effect: You open two [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1 portals in unoccupied spaces within [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance), which last until you move beyond [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) from any portal, end the effect as a maneuver, or are [dying](scc.v1:mcdm.heroes.v1/rule.health/dying). Each portal must be placed at a height of no more than 1 square above the ground. When you or any ally touch a portal, that creature can choose to be instantly [teleport](scc.v1:mcdm.heroes.v1/movement/teleport)ed to an unoccupied space of their choice [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to the other portal. If an enemy is force moved into a portal, their [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) ends and they emerge from the other portal in an unoccupied space chosen by the creature who force moved them.
      name: Effect
feature_type: ability
flavor: Knowledge of the mystery reveals that two spaces are the same space.
