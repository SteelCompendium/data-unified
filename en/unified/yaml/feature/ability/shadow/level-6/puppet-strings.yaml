    content: "\n*You prick little needles on the tips of your fingers into the nerves of your enemies and cause them to lose control.*\n\n| **Magic, [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee)**, **Strike, Weapon** |    **Main action** |\n|--------------------------------------|-------------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**                       | **\U0001F3AF Two enemies** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility):**\n\n- **≤11:** 2 damage; if the target has R < WEAK, before the damage is resolved, they make a [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike).\n- **12-16:** 5 damage; if the target has R < AVERAGE, before the damage is resolved, they use a main action ability of your choice.\n- **17+:** 7 damage; if the target has R < STRONG, before the damage is resolved, they can [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to their [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) and use a main action ability of your choice.\n\n**Effect:** You choose the new targets for the original target's [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) or ability. Additionally, if you are hidden or disguised, using this ability doesn't cause you to be revealed."
