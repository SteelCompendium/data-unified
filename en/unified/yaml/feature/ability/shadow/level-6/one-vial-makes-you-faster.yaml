cost: 9 Insight
distance: '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10'
effects:
    - roll: Power Roll + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility)
      tier1: The creature's [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) is increased by 2 until the end of the encounter.
      tier2: The creature can [fly](scc.v1:mcdm.heroes.v1/movement/fly) until the end of the encounter.
      tier3: The creature [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn) invisible until the end of their next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn).
    - effect: You ready, hand, or lob a potion to each target, who can immediately quaff the potion (no action required). If they don't drink the potion right away, they must use the [Use Consumable](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/use-consumable) maneuver to consume it later. The potion loses its [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) at the end of the encounter.
      name: Effect
feature_type: ability
flavor: Each ally who catches a potion you throw can take the battle to the next level.
keywords:
    - '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)'
metadata:
    action_type: '[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)'
    class: shadow
    content: "\n*Each ally who catches a potion you throw can take the battle to the next level.*\n\n| **[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)**       |        **[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|------------------|-----------------------:|\n| **\U0001F4CF [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10** | **\U0001F3AF Three creatures** |\n\n**Effect:** You ready, hand, or lob a potion to each target, who can immediately quaff the potion (no action required). If they don't drink the potion right away, they must use the [Use Consumable](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/use-consumable) maneuver to consume it later. The potion loses its [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) at the end of the encounter.\n\nA creature who drinks the potion receives benefits based on your [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll).\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility):**\n\n- **≤11:** The creature's [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) is increased by 2 until the end of the encounter.\n- **12-16:** The creature can [fly](scc.v1:mcdm.heroes.v1/movement/fly) until the end of the encounter.\n- **17+:** The creature [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn) invisible until the end of their next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn)."
    distance: '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10'
