    class: troubadour
    content: "\n*As you bob and weave through the crowd, you can't help but leave the audience wanting more.*\n\n| **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), [Strike](scc.v1:mcdm.heroes.v1/rule.combat/strike), Weapon** | **[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|---------------------------|-------------:|\n| **\U0001F4CF Self; see below**    |  **\U0001F3AF Self** |\n\n**Effect:** You [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to your [speed](scc.v1:mcdm.heroes.v1/rule.character/speed). You make one [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) that targets each enemy you move [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to during this [shift](scc.v1:mcdm.heroes.v1/movement/shifting).\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence):**\n\n- **≤11:** [Taunted](scc.v1:mcdm.heroes.v1/condition/taunted) ([EoT](scc.v1:mcdm.heroes.v1/rule.combat/end-of-turn)); A < WEAK[, prone](scc.v1:mcdm.heroes.v1/condition/prone)\n- **12-16:** [Taunted](scc.v1:mcdm.heroes.v1/condition/taunted) ([EoT](scc.v1:mcdm.heroes.v1/rule.combat/end-of-turn)); A < AVERAGE[, prone](scc.v1:mcdm.heroes.v1/condition/prone)\n- **17+:** [Taunted](scc.v1:mcdm.heroes.v1/condition/taunted) ([EoT](scc.v1:mcdm.heroes.v1/rule.combat/end-of-turn)); A < STRONG, [prone and](scc.v1:mcdm.heroes.v1/condition/prone) can't stand ([EoT](scc.v1:mcdm.heroes.v1/rule.combat/end-of-turn))"
