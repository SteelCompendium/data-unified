content: |-
    *Their power is dangerous. Unnatural. Someone needs to do something.*

    **Prerequisite:** You defeat three leader or solo creatures who each have at least one ability with the Magic keyword.

    **Effect:** Choose one of the following benefits:

    - *Arcane Dampening:* When resisting [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency) from magic abilities, your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are considered to be 1 higher than usual.
    - *Oh No, You Don't!:* Whenever an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) creature uses an ability with the Magic keyword, you can make a [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against them as a [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action).
    - *Stink of Magic:* As a maneuver, you open your senses to the residue of magic. Until the end of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you are aware of whether each creature within 5 squares is a construct, an undead, or a creature from another world, and whether they have used a magic ability in the previous hour. Additionally, you can't be [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised) by constructs, undead, or creatures from another world.
