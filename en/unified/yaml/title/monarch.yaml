content: |-
    *The tyrant is dead! Long live the new king!*

    **Prerequisite:** You or a member of your party becomes the [monarch](scc.v1:mcdm.heroes.v1/title/monarch) of a nation.

    **Effect:** You gain the following benefits:

    - *Royal Authority:* Inhabitants of your nation must obey your lawful orders or suffer the consequences.
    - *Royal Majesty:* Your choice of your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) increases by 1 (to a maximum of 6).

    Additionally, choose one of the following benefits:

    - *Crown Jewels:* You gain one of your nation's treasures—a [trinket](scc.v1:mcdm.heroes.v1/rule.treasure/trinket) of the Director's choice.
    - *Royal Fame:* You earn 2 [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown).
    - *Royal Retinue:* The number of [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) you can recruit increases by 2
    - *Royal [Wealth](scc.v1:mcdm.heroes.v1/rule.resource/wealth):* You earn 2 [Wealth](scc.v1:mcdm.heroes.v1/rule.resource/wealth).

    **Special:** If you take this title, you might be called upon to perform duties for your nation.
