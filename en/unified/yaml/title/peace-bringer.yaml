content: |-
    *There goes Diana, [peace bringer](scc.v1:mcdm.heroes.v1/title/peace-bringer). She has won many a [victory](scc.v1:mcdm.heroes.v1/rule.resource/victories) with her sword, but her greatest deed was convincing two nations to stop fighting.*

    **Prerequisite:** You conduct a successful negotiation on which the fate of a nation or a world stands.

    **Effect:** Your choice of your [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) increases by 1 (to a maximum of 6). Additionally, choose one of the following benefits:

    - *Calm Heads Prevail:* When you make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) to stop combat and start a negotiation, you always obtain a tier 3 outcome.
    - *Drop Your Sword:* When you succeed on a [test](scc.v1:mcdm.heroes.v1/rule.test/test) using the [Intimidate](scc.v1:mcdm.heroes.v1/skill.interpersonal/intimidate) skill, you can cause affected creatures to drop any items they are holding.
    - *Hear Me Out:* While you are present in a negotiation, an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s starting patience increases by 3 (to a maximum of 5).
    - *Many Paths to Peace:* When you make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) with a skill from the [interpersonal skill group](scc.v1:mcdm.heroes.v1/skill.group/interpersonal), you can use any [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) of your choice for the [test](scc.v1:mcdm.heroes.v1/rule.test/test).
