content: |-
    *Haul down your flag or we'll burn you to the waterline!*

    **Prerequisite:** You have the [Ship Captain](scc.v1:mcdm.heroes.v1/title/ship-captain) title, and you sink or capture a ship of equal or greater [size](scc.v1:mcdm.heroes.v1/rule.character/size) than your own.

    **Effect:** Choose one of the following benefits:

    - *Artillerist:* You gain a +5 damage [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) when using a ship's weapons
    - *Black Flag:* You have a recognizable flag that strikes terror on the high seas. While your flag is [flying](scc.v1:mcdm.heroes.v1/movement/fly) from your ship, crewmembers of other ships who have [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect) to the flag take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on [strikes](scc.v1:mcdm.heroes.v1/rule.combat/strike) made against your ship or its crew.
    - *Fearsome Reputation:* You earn 1 [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown).
    - *Scoundrel Tactics:* While aboard a ship, you can use the following skills to make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) to influence another ship up to 5 miles away whose crewmembers have [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect) to you, and you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) when you do so. You can use Disguise to hide your ship's identity or general type, Intimidate to convince another ship's crew to flee or surrender, or Hide or Sneak to let your ship avoid notice.
