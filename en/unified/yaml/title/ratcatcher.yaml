content: "*I like fighting these little guys. Means I don't have to waste money on a helmet.*\n\n**Prerequisite:** You defeat a leader or solo creature who is [size](scc.v1:mcdm.heroes.v1/rule.character/size) 1S or smaller, such as a goblin [monarch](scc.v1:mcdm.heroes.v1/title/monarch).\n\n**Effect:** Choose one of the following benefits:\n\n- *Come Out to Play:* You have the following ability, which can be paid for using the [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) of your class.\n\n##### Come Out to Play (1 Heroic Resource)\n\n>\n> *Come out to play—yay!*\n>\n> | **Area, Magic** |                                **[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n> |-----------------|--------------------------------------------:|\n> | **\U0001F4CF 5 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)**  | **\U0001F3AF Each enemy in the area hidden to you** |\n>\n> **Effect:** Each target who has P < AVERAGE is [taunted](scc.v1:mcdm.heroes.v1/condition/taunted) by you until the end of their next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), and you know the location of each creature [taunted](scc.v1:mcdm.heroes.v1/condition/taunted) in this way.\n\n- *Deadly and Big:* Your [strikes](scc.v1:mcdm.heroes.v1/rule.combat/strike) gain a +3 damage [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) against creatures whose [size](scc.v1:mcdm.heroes.v1/rule.character/size) is smaller than yours.\n- *Everybody Move!:* When you use the [Knockback](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/knockback) maneuver, you can target one additional creature of your [size](scc.v1:mcdm.heroes.v1/rule.character/size) or two additional smaller creatures."
