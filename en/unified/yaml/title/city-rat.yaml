content: |-
    *Stay out all night, visit the dives. Get in a fight, run from the cops. That's the real city.*

    **Prerequisite:** You have spent at least five [respites](scc.v1:mcdm.heroes.v1/rule.resource/respite) in a metropolis.

    **Effect:** Choose one of the following benefits:

    - *Discerning Shopper:* When looking for an [item prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite) for a [crafting project](scc.v1:mcdm.heroes.v1/rule.downtime/crafting-project), you can remember meeting someone who might have the item—or at least information about it.
    - *One with the Crowd:* While you're using one or more creatures as [cover](scc.v1:mcdm.heroes.v1/rule.combat/cover), you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made to hide and sneak.
    - *Street Smart:* While in a settlement, you can't be [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised).
