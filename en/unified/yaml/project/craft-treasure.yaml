content: 'You can craft the items found in Treasures in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards). Each treasure notes its [item prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite), [project source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source), [project roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic), and project goal.'
