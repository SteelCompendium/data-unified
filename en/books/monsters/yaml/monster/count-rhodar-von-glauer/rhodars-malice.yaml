features:
    - body: During this turn, Rhodar can move through creatures and objects at his usual speed, but can't end his turn inside a creature or object. Additionally, he doesn't take damage from being [force moved](scc.v1:mcdm.heroes.v1/movement/forced-movement).
      cost: 3 Malice
      icon: "\U0001F464"
      name: Slip
    - body: Rhodar takes an additional main action on his turn. He can use this feature even if he is [dazed](scc.v1:mcdm.heroes.v1/condition/dazed).
      cost: 5 Malice
      icon: ☠️
      name: Solo Action
    - body: Rhodar throws one of his spears into an unoccupied space within 10 squares, or chooses one of his spears that he has already thrown. Until that spear returns to him or he uses this feature again, the spear emanates magical darkness in a 5 aura. Rhodar can see through this darkness, and any enemy is suffocating while in the darkness.
      cost: 5 Malice
      icon: "\U0001F533"
      name: Suffocating Dark
    - body: Rhodar chooses two creatures or objects within 20 squares of him. The targets immediately [teleport](scc.v1:mcdm.heroes.v1/movement/teleport) to swap places. Any enemy teleported by this feature who has I < 5 is [dazed](scc.v1:mcdm.heroes.v1/condition/dazed) until the end of their next turn.
      cost: 7 Malice
      icon: "\U0001F3F9"
      name: The Mirror Lies
flavor: At the start of Rhodar's turn, you can spend Malice to activate one of the following features.
kind: malice
