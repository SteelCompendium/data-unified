features:
    - cost: 3 Malice
      icon: "\U0001F533"
      intro: "**Area, Ranged, Weapon** |   **Maneuver** | |--------------------------|---------------:| | **\U0001F4CF 1 cube within 3**   | **\U0001F3AF Special** |"
      name: Net Trap
      power_roll:
        tiers:
            high: No effect.
            low: '[Restrained](scc.v1:mcdm.heroes.v1/condition/restrained) (save ends).'
            mid: '[Restrained](scc.v1:mcdm.heroes.v1/condition/restrained) (Eot).'
      sections:
        - label: Effect
          text: A lizardfolk acting this turn sets up a net trap into the area. The first time an enemy steps into a square with a net trap, they make an **Agility test**. If the creature was unaware of the trap, they take a bane on the test.
        - label: Effect
          text: Any creature not also [restrained](scc.v1:mcdm.heroes.v1/condition/restrained) by a net trap who is [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to a creature [restrained](scc.v1:mcdm.heroes.v1/condition/restrained) by the trap can free them as a maneuver.
    - cost: 5 Malice
      icon: "\U0001F533"
      intro: A lizardfolk acting this turn unearths a magical size 2 pit that is 2 squares deep and filled with water. Any lizardfolk who moves into, then exits the pit on their turn gains 10 temporary [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), regrows their tail if applicable, and ends one effect on them that can be ended by a [saving throw](scc.v1:mcdm.heroes.v1/rule.general/saving-throw). While [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to the pit, any creature who can [burrow](scc.v1:mcdm.heroes.v1/movement/burrow) or who has the Nature skill can make a **Might test** or a **Reason test** to drain it.
      name: Water Pit
      power_roll:
        tiers:
            high: The pit empties of water.
            low: The creature falls into the pit and is knocked [prone](scc.v1:mcdm.heroes.v1/condition/prone).
            mid: The creature fails to empty the pit.
    - body: Waist-high water floods the entire encounter map. Any lizardfolk submerged in water gains an edge on abilities and doubles their speed while swimming. If there are no open water pits on the encounter map, the water drains away at the end of the round.
      cost: 7 Malice
      icon: "\U0001F300"
      name: Flood the Shores
flavor: At the start of any lizardfolk's turn, you can spend Malice to activate one of the following features.
kind: malice
metadata:
    scc: mcdm.monsters.v1/monster.lizardfolk/lizardfolk-malice
    source: mcdm.monsters.v1
name: Lizardfolk Malice
type: featureblock
