    - effects:
        - effect: |-
            **[End Effect](scc.v1:mcdm.monsters.v1/rule.monster/end-effect):** At the end of each of their turns, the kingfissure worm can take 10 damage to end one effect on them that can be ended by a [saving throw](scc.v1:mcdm.heroes.v1/rule.general/saving-throw). This damage can't be reduced in any way.
            **Solo Turns:** The kingfissure worm can take two turns each round. They can't take turns consecutively.
      feature_type: trait
      icon: ☠️
      name: Solo Monster
      type: feature
    - effects:
        - effect: The kingfissure worm has three tongues. Each tongue is a 5 x 1 line within 1 square of the kingfissure worm, has 35 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) and psychic immunity all, and can't be [force moved](scc.v1:mcdm.heroes.v1/movement/forced-movement). Each tongue enables the kingfissure worm to [grab](scc.v1:mcdm.heroes.v1/condition/grabbed) one size 3 or smaller creature or object. A tongue can be targeted by abilities only while it has a target [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).
      feature_type: trait
      icon: ⭐️
      name: Multiple Tongues
      type: feature
    - ability_type: Signature Ability
      distance: Melee 5
      effects:
