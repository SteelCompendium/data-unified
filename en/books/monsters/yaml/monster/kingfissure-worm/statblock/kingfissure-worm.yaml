      name: Titanic Tunneler
      type: feature
    - effects:
        - effect: The kingfissure worm can't be [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) or knocked [prone](scc.v1:mcdm.heroes.v1/condition/prone). While the worm is [restrained](scc.v1:mcdm.heroes.v1/condition/restrained) or [slowed](scc.v1:mcdm.heroes.v1/condition/slowed), they take a −2 penalty to speed instead of suffering those conditions' usual effects on speed.
      feature_type: trait
      icon: ⭐️
      name: Unstoppable Crawler
      type: feature
