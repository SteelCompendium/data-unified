    - distance: Melee 5 or ranged 10
      effects:
        - effect: '**Effect:** The kingfissure worm can use this maneuver only while they have a creature or object [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed). The worm slams the [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) creature or object against the target, dealing 13 damage to both. If this ability is used at range, it deals an extra 5 damage and the [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) creature or object is released.'
      feature_type: ability
      icon: ⚔️
