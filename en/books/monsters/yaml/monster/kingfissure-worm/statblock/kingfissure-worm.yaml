            **Effect:** The kingfissure worm deals 5 damage to the creature or object the tongue had [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed), releases that creature or object, then pulls the damaged tongue back into their mouth.
      feature_type: ability
      icon: ❗️
      keywords: []
      name: Tearing Recoil
      target: Special
      type: feature
      usage: Triggered action
    - effects:
        - effect: The kingfissure worm has line of effect only within 3 squares However, they ignore concealment for creatures touching the ground and don't need line of effect to use abilities against those creatures.
      feature_type: trait
      icon: ⭐️
      name: Seismic King
      type: feature
    - effects:
        - effect: A creature swallowed by the kingfissure worm is [restrained](scc.v1:mcdm.heroes.v1/condition/restrained) and takes 1d6 acid damage at the start of every turn. If the worm takes 25 or more damage in a single round from swallowed creatures, they immediately regurgitate all creatures they have swallowed, who land [prone](scc.v1:mcdm.heroes.v1/condition/prone) in unoccupied spaces within 3 squares of the kingfissure worm.
      feature_type: trait
      icon: ⭐️
      name: Swallowed
      type: feature
    - effects:
        - effect: The kingfissure worm can [burrow](scc.v1:mcdm.heroes.v1/movement/burrow) through stone. When the worm burrows, they create a stable size 3 tunnel in the squares they move through.
      feature_type: trait
