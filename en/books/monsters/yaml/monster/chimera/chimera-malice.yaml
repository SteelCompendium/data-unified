features:
    - body: The chimera takes up a defensive stance. Until the start of their next turn, the chimera can make a [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against each enemy who comes within 2 squares of them.
      cost: 3 Malice
      icon: ⭐️
      name: Defensive Snapping
    - body: The chimera takes an additional main action on their turn. They can use this feature even if they are [dazed](scc.v1:mcdm.heroes.v1/condition/dazed).
      cost: 5 Malice
      icon: ☠️
      name: Solo Action
    - body: The chimera shakes the ground, causing an eruption of loose rocks and debris that creates three size 2 stone objects anywhere on the encounter map. Each creature [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to one or more objects when they appear who has A < 2 takes 5 damage.
      cost: 5 Malice
      icon: "\U0001F533"
      name: Unstable Terrain
    - body: Until the start of the chimera's next turn, all areas of the encounter map are shrouded in a thick cloud of ash. All creatures and objects on the map have [concealment](scc.v1:mcdm.heroes.v1/rule.combat/concealment) that the chimera ignores. Additionally, each enemy in the cloud who has I < 1 has [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect) only within 3 squares. The [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) of this feature increases by 1 each time it's used.
      cost: 7 Malice
      icon: "\U0001F300"
      name: Ashen Clouds
flavor: At the start of a chimera's turn, you can spend Malice to activate one of the following features.
kind: malice
