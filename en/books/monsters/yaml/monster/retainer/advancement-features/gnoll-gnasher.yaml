      name: Horrific Feas
      sections:
        - label: Trigger
          text: The gnasher reduces a creature to 0 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina).
        - label: Effect
          text: The gnasher consumes part of the target's body. The gnasher can spend a [Recovery](scc.v1:mcdm.heroes.v1/rule.health/recoveries), and each enemy within 5 squares of the gnasher who has I < AVERAGE is [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) ([save](scc.v1:mcdm.heroes.v1/rule.general/saving-throw) ends).
      target: Self
      usage: Main action
