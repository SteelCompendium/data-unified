        - roll: Power Roll + 5
          tier1: 8 corruption damage; A < 4 [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) (save ends)
          tier2: 13 corruption damage; A < 5 [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) (save ends)
          tier3: 16 corruption damage; A < 6 [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) (save ends)
        - effect: At the end of each of the lich's turns, they regain 10 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) for each creature [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) this way.
          name: Effect
