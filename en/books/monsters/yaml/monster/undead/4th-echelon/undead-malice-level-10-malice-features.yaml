features:
    - body: The [undead](scc.v1:mcdm.monsters.v1/rule.keyword/undead) activates a [Malice](scc.v1:mcdm.monsters.v1/rule.monster/malice) feature available to [undead](scc.v1:mcdm.monsters.v1/rule.keyword/undead) of level 9 or lower.
      cost: 2-7+ Malice
      icon: ⭐️
      name: Prior Malice Features
    - cost: 7 Malice
      icon: ❇️
      intro: The [undead](scc.v1:mcdm.monsters.v1/rule.keyword/undead) attempts to rend the vitality of their foes. Each enemy within 5 squares of the [undead](scc.v1:mcdm.monsters.v1/rule.keyword/undead) makes a **Might test**.
      name: Death Tax
      power_roll:
        tiers:
            high: 5 corruption damage
            low: 10 corruption damage; the target loses 2 [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries)
            mid: 8 corruption damage; the target loses 1 [Recovery](scc.v1:mcdm.heroes.v1/rule.health/recoveries)
      sections:
        - label: Effect
          text: A target who has fewer [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries) than they would lose is also [weakened](scc.v1:mcdm.heroes.v1/condition/weakened) (save ends).
        - label: Special
          text: This ability can't be used by a [minion](scc.v1:mcdm.monsters.v1/rule.organization/minion).
flavor: At the start of any level 10 undead's turn, you can spend Malice to activate one of the following features.
kind: malice
level: 10
metadata:
    scc: mcdm.monsters.v1/monster.undead.4th-echelon/undead-malice-level-10-malice-features
    source: mcdm.monsters.v1
name: Undead Malice (Level 10 Malice Features)
type: featureblock
