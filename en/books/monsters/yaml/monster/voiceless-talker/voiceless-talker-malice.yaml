features:
    - body: One non-[minion](scc.v1:mcdm.monsters.v1/rule.organization/minion) voiceless talker projects a psionic screen over their body, preventing other creatures from treating them as an enemy until the end of the voiceless talker's next turn.
      cost: 3 Malice
      icon: "\U0001F464"
      name: Guise
    - cost: 5 Malice
      distance: Ranged 5
      icon: "\U0001F3F9"
      keywords:
        - Psionic
        - Ranged
      name: Memory Thief
      power_roll:
        formula: + 3
        tiers:
            high: 13 psychic damage; R < 3 the target perceives their allies as enemies (save ends)
            low: 6 psychic damage; R < 1 the target can't treat their allies as allies (save ends)
            mid: 10 psychic damage; R < 2 the target perceives their allies as enemies (save ends)
      sections:
        - label: Special
          text: This ability can't be used by a [minion](scc.v1:mcdm.monsters.v1/rule.organization/minion).
      target: One creature
      usage: Maneuver
    - body: All voiceless talkers link their minds, creating a circuit that empowers them while two or more voiceless talkers remain in the encounter. While this circuit is active, any psionic strike made by a voiceless talker deals an extra 5 damage. Additionally, when a non-[minion](scc.v1:mcdm.monsters.v1/rule.organization/minion) voiceless talker takes damage, they can use a free triggered action to swap places with any voiceless talker [minion](scc.v1:mcdm.monsters.v1/rule.organization/minion) on the encounter map. The [minion](scc.v1:mcdm.monsters.v1/rule.organization/minion) takes the damage instead.
      cost: 10 Malice
      icon: "\U0001F300"
      name: Evolutionary Circuit
flavor: At the start of any voiceless talker's turn, you can spend Malice to activate one of the following features.
kind: malice
metadata:
    scc: mcdm.monsters.v1/monster.voiceless-talker/voiceless-talker-malice
    source: mcdm.monsters.v1
