content: '[Minions](scc.v1:mcdm.monsters.v1/rule.organization/minion) with the same name (for instance, goblin sniper) can be organized into squads of up to eight creatures. All members of a minion squad act together on the same initiative, and can make squad attacks (see Acting Together below).'
name: Organized as Squads
scc: mcdm.monsters.v1/rule.monster/squad
type: rule
