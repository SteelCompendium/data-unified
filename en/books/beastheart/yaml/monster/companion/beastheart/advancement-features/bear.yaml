features:
    - body: Whenever the bear targets a creature with a strike that doesn't impose [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) while rampaging, the bear can push the target up to a number of squares equal to the bear's Might score.
      level: 3
      name: Foe Thresher
    - body: While the bear is rampaging, you have damage immunity 5 and your size increases to the bear's size (to a maximum of 2). If you don't have enough unoccupied space to grow, you grow as soon as there is sufficient space.
      level: 6
      name: Ursine Form
    - body: While the bear is rampaging, you gain a +1 bonus to distance with melee weapon abilities, your size increases to match the bear's size (to a maximum of 3), and your strikes deal an extra 5 damage.
      level: 10
      name: Twin Colossi
