features:
    - body: Whenever the condor makes a strike while rampaging, they deal extra damage equal to the number of squares they've moved on their turn (to a maximum of 5).
      level: 3
      name: Dive Bomb
    - body: While the condor is rampaging, you gain wings and can [fly](scc.v1:mcdm.heroes.v1/movement/fly). While flying, you gain a +2 bonus to speed. If you are midair when the condor's rampage ends, you take no damage from the fall.
      level: 6
      name: Borne Aloft
    - body: While the condor is rampaging, you and the condor gain a +5 bonus to speed.
      level: 10
      name: Flight of the Condor
