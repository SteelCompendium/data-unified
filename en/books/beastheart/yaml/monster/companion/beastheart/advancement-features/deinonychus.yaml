features:
    - body: Whenever the deinonychus makes a strike against a creature while rampaging, the target is [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding) until the end of their next turn.
      level: 3
      name: Tear You to Ribbons
    - body: Whenever you use an ability that deals rolled damage to a [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding) creature while the deinonychus is rampaging, you gain 2 surges.
      level: 6
      name: Slake My Thirst in Blood
    - body: The deinonychus's claws slash at creatures underfoot. When the deinonychus moves adjacent to an enemy or enters an enemy's space for the first time on a turn while rampaging, the deinonychus deals damage to that enemy equal to the deinonychus's Might score.
      level: 10
      name: Reaping Scythe
