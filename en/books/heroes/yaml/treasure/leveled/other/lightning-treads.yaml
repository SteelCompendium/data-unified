content: |-
    *Sparks strike from these boots whenever they touch the ground, increasing in number as the wearer gathers [speed](scc.v1:mcdm.heroes.v1/rule.character/speed).*

    **Keywords:** Feet, Magic

    **[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** One jar of lightning

    **[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** Texts or lore in Yllyric

    **[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility), [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)

    **Project Goal:** 450

    **1st Level:** While you wear these boots, any weapon ability that deals [rolled damage](scc.v1:mcdm.heroes.v1/rule.damage/rolled-damage) using your unarmed [strikes](scc.v1:mcdm.heroes.v1/rule.combat/strike) deals an extra 1 lightning damage. Additionally, you gain a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed).

    **5th Level:** The extra lightning damage granted by the treads increases to 2. Additionally, for each square you move on your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) before you use a weapon ability that deals [rolled damage](scc.v1:mcdm.heroes.v1/rule.damage/rolled-damage) using your unarmed [strikes](scc.v1:mcdm.heroes.v1/rule.combat/strike), this extra damage increases by 1 (to a maximum of 4).

    **9th Level:** The extra lightning damage granted by the treads increases to 3, and your movement can increase that extra damage to a maximum of 6. Additionally, you can use a maneuver to perform a [flying](scc.v1:mcdm.heroes.v1/movement/fly) lightning kick on one [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) creature. That target is [pushed](scc.v1:mcdm.heroes.v1/movement/forced-movement) up to 5 squares, and you can move to any square [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to the target after the [push](scc.v1:mcdm.heroes.v1/movement/forced-movement).
flavor: Sparks strike from these boots whenever they touch the ground, increasing in number as the wearer gathers speed.
