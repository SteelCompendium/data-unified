content: |-
    **[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** Varies (see description)

    **[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** None

    **[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)

    **Project Goal:** Varies

    You research a cure for a disease, curse, or [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) affliction whose text states that it can be ended by the Find a Cure downtime project. If the affliction was caused by the innate feature of a creature, you need the remains of that creature or another creature of the same kind as an [item prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite) for crafting the cure. For example, you can research the cure for the affliction of a werewolf's Accursed Bite by studying the corpse of any werewolf, not just the one who did the biting.

    The number of [project points](scc.v1:mcdm.heroes.v1/rule.downtime/project-points) it takes to complete this project is equal to 50 times the level of the creature who caused the affliction. If the affliction was created by an environmental or [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) effect, that effect notes the [item prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite) and [project points](scc.v1:mcdm.heroes.v1/rule.downtime/project-points) required to complete this project.

    When you complete this project, you craft one dose of an alchemical cure for the affliction. Once the project is completed, you can craft subsequent doses for the same affliction for half the number of [project points](scc.v1:mcdm.heroes.v1/rule.downtime/project-points) required for the initial project.
