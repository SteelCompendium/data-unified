content: Many [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) stay at a [stronghold](scc.v1:mcdm.heroes.v1/title/stronghold), which is a home base you designate and can change. Your [stronghold](scc.v1:mcdm.heroes.v1/title/stronghold) is typically a location shared by your fellow heroes. It could be a few rooms at an inn in a sleepy village, an old castle you claimed after clearing it of monsters, or a fleet of sailing ships.
