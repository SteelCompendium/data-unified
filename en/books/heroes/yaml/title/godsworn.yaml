content: |-
    *He seemed like he needed help! Now the dead speak to me. I think maybe that old man was more than he appeared.*

    **Prerequisite:** You do a favor for an agent of a god or [saint](scc.v1:mcdm.heroes.v1/rule.world/saint), or promise to do so.

    **Effect:** Choose one of the following benefits:

    - *Healing Gift:* You can use the 1st-level [Conduit](scc.v1:mcdm.heroes.v1/class/conduit) feature [Healing Grace](scc.v1:mcdm.heroes.v1/feature.ability.conduit.level-1/healing-grace) as if you had spent 1 [piety](scc.v1:mcdm.heroes.v1/feature.conduit.level-1/piety) (see Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes)). Once you use this benefit, you can't use it again until you earn 1 or more [Victories](scc.v1:mcdm.heroes.v1/rule.resource/victories).
    - *Last-Ditch Prayer:* As a [free maneuver](scc.v1:mcdm.heroes.v1/rule.combat/free-maneuver), you recite a prayer for help, gaining a pool of 2d10 of the [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) granted by your class. This pool disappears at the end of your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) if you haven't used it. Once you use this benefit, you can't use it again until you perform another service for a god or [saint](scc.v1:mcdm.heroes.v1/rule.world/saint), or until you gain a level.
    - *Touched by the Divine:* Choose a god or [saint](scc.v1:mcdm.heroes.v1/rule.world/saint) from the Deities and  Domains table in Chapter 14: [Gods and Religion](scc.v1:mcdm.heroes.v1/chapter/gods-and-religion). From that god or [saint](scc.v1:mcdm.heroes.v1/rule.world/saint)'s domains, choose a [Conduit](scc.v1:mcdm.heroes.v1/class/conduit) 1st-level domain feature (see Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes)).
