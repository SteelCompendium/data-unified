content: |-
    When you attract a new [follower](scc.v1:mcdm.heroes.v1/rule.general/follower), you decide on their name and ancestry, and choose what role they play in their service to you.

    ##### Artisan

    Artisans are crafting experts who can contribute to your research and [crafting projects](scc.v1:mcdm.heroes.v1/rule.downtime/crafting-project) (see Chapter 12: [Downtime Projects](scc.v1:mcdm.heroes.v1/chapter/downtime-projects)). An artisan can contribute one [project roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) per day to a downtime project you choose, whether you spend those days in [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite), adventuring, or other activities. They must remain at your [stronghold](scc.v1:mcdm.heroes.v1/title/stronghold) or at the site where the project is undertaken, and must have access to the necessary materials.

    When you recruit an artisan, choose four skills from the [crafting skill group](scc.v1:mcdm.heroes.v1/skill.group/crafting) that they know (see Skills in Chapter 9: [Tests](scc.v1:mcdm.heroes.v1/chapter/tests)). An artisan has a [Might](scc.v1:mcdm.heroes.v1/rule.character/might) or [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) score of 1 (your choice), a [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) score of 1, and a 0 in all other [characteristics](scc.v1:mcdm.heroes.v1/rule.character/characteristic). They know Caelian and two other languages of your choice.

    ##### Sage

    Sages are research experts who can contribute to your research and [crafting projects](scc.v1:mcdm.heroes.v1/rule.downtime/crafting-project). A sage can contribute one [project roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) per day to a downtime project you choose, whether you spend those days in [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite), adventuring, or other activities. They must remain at your [stronghold](scc.v1:mcdm.heroes.v1/title/stronghold) or at the site where the project is undertaken, and must have access to the necessary materials.

    When you recruit a sage, choose four skills from the [lore skill group](scc.v1:mcdm.heroes.v1/skill.group/lore) that they know. A sage has a [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) and [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score of 1, and a 0 in all other [characteristics](scc.v1:mcdm.heroes.v1/rule.character/characteristic). They know Caelian and two other languages of your choice.
