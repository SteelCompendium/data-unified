content: |-
    *Marduk uses the Beldoit Gambit! Avanna counters with the Iron Defense and goes on the attack! Marduk's last tower is knocked down! And just like that, we have a new... world... champion!*

    **Prerequisite:** You beat the best in the world at a game or sport.

    **Effect:** A [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) used during the competition increases by 1 (to a maximum of 6). Additionally, choose one of the following benefits:

    - *Best of the Best:* Choose a skill you used during the competition. You gain a +4 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made using that skill instead of a +2 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties)
    - *Glory and Riches:* You earn 2 [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) and 1 [Wealth](scc.v1:mcdm.heroes.v1/rule.resource/wealth).
    - *I'll Just Take the Prize:* You gain a [trinket](scc.v1:mcdm.heroes.v1/rule.treasure/trinket) or [leveled treasure](scc.v1:mcdm.heroes.v1/rule.treasure/leveled-treasure) of the Director's choice.
