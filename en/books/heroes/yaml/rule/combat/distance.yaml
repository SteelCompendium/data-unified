content: "An ability's \"Distance\" entry, represented by this symbol \U0001F4CF, indicates how close you need to be to a creature or object to affect that target with the ability.\n\n##### Melee\n\n[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) abilities have a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of \"[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) X\" and require you to make contact with a creature with your body, a weapon, or an [implement](scc.v1:mcdm.heroes.v1/rule.treasure/implement). The number X is the maximum [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) in squares at which you can physically make contact with another creature or object targeted by the ability. For instance, a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of \"[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 2\" can be used to target creatures or objects within 2 squares of you, while \"[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1\" limits you to [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) targets (those within 1 square).\n\n##### Ranged\n\n[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) abilities have a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of \"[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) X\" and can be used to target creatures or objects too far away for you to make contact with. The number X is the maximum [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) in squares at which a creature or object can be targeted by the ability. For instance, a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of \"[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 5\" can be used to target creatures or objects within 5 squares of you.\n\nIf you make a [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) while any enemy is [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you (within 1 square), you have a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on the [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike)'s [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll). (See [Edges](scc.v1:mcdm.heroes.v1/rule.dice/edge) and [Banes](scc.v1:mcdm.heroes.v1/rule.dice/bane) in Chapter 1: [The Basics](scc.v1:mcdm.heroes.v1/chapter/the-basics).)\n\n##### Melee or Ranged\n\nSome abilities have a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) and a [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance). When you use such an ability, you choose whether to use it as a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) or a [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) ability.\n\nAn ability never has both the [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) and [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) keywords at the same time. For example, if you have the [Cloak and Dagger](scc.v1:mcdm.heroes.v1/kit/cloak-and-dagger) kit, which has a weapon damage [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) abilities and a weapon damage [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) abilities, only one [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) at a time applies to an ability with both the [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) and [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) keywords. (See Chapter 6: [Kits](scc.v1:mcdm.heroes.v1/chapter/kits).)\n\n##### Self\n\nIf an ability has a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of \"Self,\" that ability originates from you, and often affects only you. The ability's description specifies how it works."
name: Distance
scc: mcdm.heroes.v1/rule.combat/distance
type: rule
