content: |-
    The Director decides how difficult a task that requires a [test](scc.v1:mcdm.heroes.v1/rule.test/test) is: easy, medium, or hard. If a task seems as though it's easier than easy, then no [test](scc.v1:mcdm.heroes.v1/rule.test/test) is necessary. The hero simply accomplishes the task. If the task seems harder than hard, then the Director is free to decide that it's impossible to complete with a [test](scc.v1:mcdm.heroes.v1/rule.test/test).

    On a [test](scc.v1:mcdm.heroes.v1/rule.test/test)-by-[test](scc.v1:mcdm.heroes.v1/rule.test/test) basis, the Director can share the difficulty of a task before the player makes the [test](scc.v1:mcdm.heroes.v1/rule.test/test), which makes interpreting the outcome faster at the table. The Director can also keep a [test](scc.v1:mcdm.heroes.v1/rule.test/test)'s difficulty secret until after the player rolls the [test](scc.v1:mcdm.heroes.v1/rule.test/test), for dramatic effect.

    The [Test](scc.v1:mcdm.heroes.v1/rule.test/test) Difficulty Outcomes table shows all the possible outcomes of the different difficulties of [tests](scc.v1:mcdm.heroes.v1/rule.test/test). The Director will keep this information handy so as to be able to compare the different difficulties and their outcomes during play.

    ###### Test Difficulty Outcomes Table

    | [Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll)       | Easy [Test](scc.v1:mcdm.heroes.v1/rule.test/test) Outcomes         | Medium [Test](scc.v1:mcdm.heroes.v1/rule.test/test) Outcomes       | Hard [Test](scc.v1:mcdm.heroes.v1/rule.test/test) Outcomes         |
    |------------------|----------------------------|----------------------------|----------------------------|
    | ≤11              | Success with a consequence | Failure                    | Failure with a consequence |
    | 12-16            | Success                    | Success with a consequence | Failure                    |
    | 17+              | Success with a reward      | Success                    | Success                    |
    | [Natural 19 or 20](scc.v1:mcdm.heroes.v1/rule.dice/natural-19-20) | Success with a reward      | Success with a reward      | Success with a reward      |

    Whenever the rules talk about obtaining a success on a [test](scc.v1:mcdm.heroes.v1/rule.test/test), that includes a straight success, a success with a consequence, or a success with a reward. Whenever the rules talk about a failure on a [test](scc.v1:mcdm.heroes.v1/rule.test/test), that includes a straight failure or a failure with a consequence.

    Whenever you make a [test](scc.v1:mcdm.heroes.v1/rule.test/test) whose outcome you don't like, you can spend a [hero token](scc.v1:mcdm.heroes.v1/rule.resource/hero-token) to reroll the [test](scc.v1:mcdm.heroes.v1/rule.test/test). You must use the new roll.

    ##### Easy Tests

    An easy [test](scc.v1:mcdm.heroes.v1/rule.test/test) has some risk of consequence, but most heroes will likely overcome it. The [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) you make for an easy [test](scc.v1:mcdm.heroes.v1/rule.test/test) determines the outcome (see [Test](scc.v1:mcdm.heroes.v1/rule.test/test) Outcomes below):

    - **≤11:** You succeed on the task and incur a consequence.
    - **12-16:** You succeed on the task.
    - **17+:** You succeed on the task with a reward.

    ##### Medium Tests

    A medium [test](scc.v1:mcdm.heroes.v1/rule.test/test) has some risk of failure that most heroes will likely overcome—but with a cost. The [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) you make for a medium [test](scc.v1:mcdm.heroes.v1/rule.test/test) determines the outcome:

    - **≤11:** You fail the task.
    - **12-16:** You succeed on the task and incur a consequence.
    - **17+:** You succeed on the task.

    ##### Hard Tests

    A hard [test](scc.v1:mcdm.heroes.v1/rule.test/test) has a greater risk of failure, and most heroes are likely to suffer some hardship while trying to overcome the intended task. The [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) you make for a hard [test](scc.v1:mcdm.heroes.v1/rule.test/test) determines the outcome:

    - **≤11:** You fail the task and incur a consequence.
    - **12-16:** You fail the task.
    - **17+:** You succeed on the task.
