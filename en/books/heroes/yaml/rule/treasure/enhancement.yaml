content: |-
    Armor imbued with an enhancement grants you special benefits while it is worn. Additionally, when your armor receives its 1st-level enhancement, it also grants a +6 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina). A 5th-level enhancement increases the [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to +12, and a 9th-level enhancement increases it to +21.

    > **Clothing as Armor Treasures**
    >
    > A hero who has a kit that provides no armor, such as the [Martial Artist](scc.v1:mcdm.heroes.v1/kit/martial-artist) or [Sniper](scc.v1:mcdm.heroes.v1/kit/sniper) kit, can create and make use of leveled armor treasures that imbue mundane clothing with [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) power. At the Director's discretion, heroes who don't use kits, such as [elementalists](scc.v1:mcdm.heroes.v1/class/elementalist) and [nulls](scc.v1:mcdm.heroes.v1/class/null), can also benefit from such treasures.

    ###### 1st-Level Armor Enhancement

    **[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** Varies

    **[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** Texts or lore in a language determined by the [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)

    **[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Might](scc.v1:mcdm.heroes.v1/rule.character/might), [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)

    **Project Goal:** 150

    **Awe:** When you start this project, choose either Charming or Threatening. If you choose Charming, you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made to win other creatures over or make a good impression. If you choose Threatening, you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made to intimidate, coerce, or bully.

    **[Damage Immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) I:** When you start this project, select three [damage types](scc.v1:mcdm.heroes.v1/rule.damage/damage-type). You have immunity 5 to those [damage types](scc.v1:mcdm.heroes.v1/rule.damage/damage-type).

    **Disguise:** You can use a maneuver to cause this armor to take the form of any type of clothing that you have been in the presence of—a noble's dress, a guard's uniform, a cultist's robes, and so forth. The armor loses none of its protective qualities while transformed into other clothing.

    **Iridescent:** When you are the sole target of an ability, you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to reveal that the ability was targeting an afterimage of you in the same space as you. The [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) for the ability is treated as an 11. You can't use this [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement) again until you earn 1 or more [Victories](scc.v1:mcdm.heroes.v1/rule.resource/victories).

    **Magic Resistance I:** Your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are treated as 1 higher (to a maximum of 2) for the purpose of resisting the [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency) of magic abilities.

    **Nettlebloom:** Whenever you are [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) by an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) creature, your armor sprouts toxic nettles. While that creature has you [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed), they are [weakened](scc.v1:mcdm.heroes.v1/condition/weakened).

    **Phasing I:** Once per [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you can move through 1 square of solid matter. If you end your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) inside solid matter, you are forced out into the space from which you entered it and you take 5 damage that can't be reduced in any way.

    **Psionic Resistance I:** Your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are treated as 1 higher (to a maximum of 2) for the purpose of resisting the [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency) of psionic abilities.

    **Swift:** You gain a +1 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed).

    **Tempest I:** As a maneuver, you infuse this armor with the essence of a storm. The first time an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) creature deals damage to you before the end of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), they take lightning damage equal to your highest [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) score and you can [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) them 1 square.

    ###### 1st-Level Armor Enhancements Table

    | [Enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)          | [Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite)                                                                                | [Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source) Language |
    |----------------------|--------------------------------------------------------------------------------------------------|-------------------------|
    | Awe                  | A lock of hair from a fey, taken in amicable bargain for Charming or in violence for Threatening | Khelt                   |
    | [Damage Immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) I    | Elemental sand left behind when an elemental enters [Orden](scc.v1:mcdm.heroes.v1/rule.world/orden) from Quintessence                      | Zaliac                  |
    | Disguise             | The blood of a lycanthrope                                                                       | Khelt                   |
    | Iridescent           | Fur from a lightbender                                                                           | Hyrallic                |
    | Magic Resistance I   | A scale from a dragon                                                                            | The First Language      |
    | Nettlebloom          | A rose from the magical hedge of a hag                                                           | Khelt                   |
    | Phasing I            | Ichor from a destroyed wraith                                                                    | Szetch                  |
    | Psionic Resistance I | Rare crystals that resonate with psionic energy, often found at sites of psionic experimentation | Voll                    |
    | Swift                | The feather of a falcon slain as it was diving                                                   | Yllyric                 |
    | Tempest I            | A strip of starmetal struck by lightning                                                         | Ullorvic                |

    ###### 5th-Level Armor Enhancement

    **[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** Armor with a 1st-level [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement); varies

    **[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** Texts or lore in a language determined by the [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)

    **[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Might](scc.v1:mcdm.heroes.v1/rule.character/might), [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)

    **Project Goal:** 150

    **Absorption:** Whenever you are targeted by a magic or psionic ability that targets only one creature, you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to cause this armor to absorb the ability after the ability's effects resolve. While the armor has an ability absorbed, you can't absorb another.

    You can use an absorbed ability as if you knew it, making [power rolls](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) for the ability using your choice of [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition), or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence). You don't need to spend any [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) to activate the ability. Once you use the ability, the armor loses it, and you can absorb another.

    **[Damage Immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) II:** The [damage immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) conveyed by the armor increases to 10.

    **Dragon Soul:** When another creature causes you to be [winded](scc.v1:mcdm.heroes.v1/rule.health/winded) or [dying](scc.v1:mcdm.heroes.v1/rule.health/dying), you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to cause the soul of a dragon to emerge from this armor and hurtle toward the creature. Make the following [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) against the creature.

    **[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + Your Highest [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) Score:**

    - **≤11:** 8 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 3
    - **12-16:** 12 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 4
    - **17+:** 15 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 5

    **Levitating:** On your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you can treat up to 5 consecutive squares of movement as [flying](scc.v1:mcdm.heroes.v1/movement/fly) movement. If you are still in midair at the end of your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), you [fall prone](scc.v1:mcdm.heroes.v1/condition/prone).

    **Magic Resistance II:** Your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are treated as 2 higher (to a maximum of 3) for the purpose of resisting the [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency) of magic abilities. This benefit replaces Magic Resistance I.

    **Phasing II:** When you use the armor's Phasing I [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement), you can move through 3 squares of solid matter per [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn).

    **Psionic Resistance II:** Your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are treated as 2 higher (to a maximum of 3) for the purpose of resisting the [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency) of psionic abilities. This benefit replaces Psionic Resistance I.

    **Reactive:** Whenever you take damage, you have [damage immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) 2 until the end of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) after the triggering damage is resolved.

    **Second Wind:** Whenever you become [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to spend a [Recovery](scc.v1:mcdm.heroes.v1/rule.health/recoveries).

    **Shattering:** Whenever an enemy scores a [critical hit](scc.v1:mcdm.heroes.v1/rule.combat/critical-hit) against you, they take 10 sonic damage.

    **Tempest II:** When you use the armor's Tempest I [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement), the affected creature takes 8 lightning damage and you [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) them up to 3 squares.

    ###### 5th-Level Armor Enhancements Table

    | [Enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)           | [Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite)                                                                 | [Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source) Language |
    |-----------------------|-----------------------------------------------------------------------------------|-------------------------|
    | Absorption            | A mirror blessed by a priest of a god of magic                                    | The First Language      |
    | [Damage Immunity](scc.v1:mcdm.heroes.v1/rule.damage/damage-immunity) II    | The essence of an elemental who is still alive                                    | Zaliac                  |
    | Dragon Soul           | A scale from a dead dragon                                                        | Vastariax               |
    | Levitating            | A palm-sized crystal grown in the subterranean lair of an overmind                | Zaliac                  |
    | Magic Resistance II   | A scale from a mature dragon                                                      | The First Language      |
    | Phasing II            | The remnants of a slain ooze                                                      | Szetch                  |
    | Psionic Resistance II | A fresh crystalline scale from a gemstone dragon                                  | Voll                    |
    | Reactive              | A complex, hand-engineered set of brass gears inscribed with runes in silver dust | Zaliac                  |
    | Second Wind           | The sweat of a troll                                                              | Kalliak                 |
    | Shattering            | A pound of volcanic obsidian, formed naturally as a single piece                  | Zaliac                  |
    | Tempest II            | The armor must be laid out under a clear sky as a comet passes over               | Ullorvic                |

    ###### 9th-Level Armor Enhancement

    **[Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite):** Armor with a 5th-level [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement); varies

    **[Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source):** Texts or lore in a language determined by the [enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)

    **[Project Roll](scc.v1:mcdm.heroes.v1/rule.downtime/project-roll) [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** [Might](scc.v1:mcdm.heroes.v1/rule.character/might), [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), or [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition)

    **Project Goal:** 150

    **Devil's Bargain:** You can [fly](scc.v1:mcdm.heroes.v1/movement/fly). Additionally, if an effect would make you [prone](scc.v1:mcdm.heroes.v1/condition/prone) while [flying](scc.v1:mcdm.heroes.v1/movement/fly), you can choose to not make you [prone](scc.v1:mcdm.heroes.v1/condition/prone) by losing [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) equal to the [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) you would have fallen from make you [prone](scc.v1:mcdm.heroes.v1/condition/prone).

    **Dragon Soul II:** While you are [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), your head transforms into a dragon's head and you have the following ability.

    ###### 9th-Level Armor Enhancements Table

    | [Enhancement](scc.v1:mcdm.heroes.v1/rule.treasure/enhancement)            | [Item Prerequisite](scc.v1:mcdm.heroes.v1/rule.downtime/item-prerequisite)                                                                                    | [Project Source](scc.v1:mcdm.heroes.v1/rule.downtime/project-source) Language |
    |------------------------|------------------------------------------------------------------------------------------------------|-------------------------|
    | Devil's Bargain        | The wing of an archdevil                                                                             | Anjali                  |
    | Dragon Soul II         | An offering of gems, coins, and art stolen from a dragon's hoard, sacrificed in ritual fire          | Vastariax               |
    | Invulnerable           | Repurposed metal plates from a servok war engine                                                     | Rallarian               |
    | Leyline Walker         | A cutting from an ethereal tree that manifests in the mundane world only once a year                 | Yllyric                 |
    | Life                   | The tear of a [saint](scc.v1:mcdm.heroes.v1/rule.world/saint)                                                                                  | High Kuric              |
    | Magic Resistance III   | A scale from an ancient dragon                                                                       | The First Language      |
    | Phasing III            | Perfectly clear glass from a house that disappeared into the Ethereal Plane                          | Szetch                  |
    | Psionic Resistance III | The skull of a voiceless talker at least a century old                                               | Voll                    |
    | Temporal Flux          | An experimental temporal capacitor invented by the kuran'zoi                                         | Voll                    |
    | Unbending              | A spearhead or other weapon broken off in the body of a stone giant, and ossified for a year or more | High Kuric              |
