content: |-
    When your [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) is 0 or lower, you are dying. While dying, you can't use the [Catch Breath](scc.v1:mcdm.heroes.v1/feature.common.maneuvers/catch-breath) maneuver in combat. Additionally, you are [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding), and this instance of the [condition](scc.v1:mcdm.heroes.v1/rule.combat/condition) can't be negated or removed in any way until you are no longer dying. While you are dying, you can still act, your allies can help you spend [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries) in combat, and you can spend [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries) out of combat as usual.

    While your [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) is lower than 0, if it reaches the negative of your [winded](scc.v1:mcdm.heroes.v1/rule.health/winded) value, you die. When you die, you can't be brought back to life without the use of a special powerful item, such as a Scroll of Resurrection.
name: Dying and Death
scc: mcdm.heroes.v1/rule.health/dying
type: rule
