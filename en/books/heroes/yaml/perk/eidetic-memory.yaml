content: Your mind is an encyclopedia, though not always an easy one to organize. When you finish a [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite), choose one skill from the [lore skill group](scc.v1:mcdm.heroes.v1/skill.group/lore) that you don't have. You have that skill until you finish your next [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite). Additionally, if you spend 1 uninterrupted minute or more reading any page of text, you can memorize its contents, allowing you to memorize entire books with sufficient time.
