benefit: You have a +1 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [stability](scc.v1:mcdm.heroes.v1/rule.character/stability). Additionally, you can use a [free maneuver](scc.v1:mcdm.heroes.v1/rule.combat/free-maneuver) to cause your body, gear, and any items you hold to take on the appearance of stone, making you appear to be a [mundane](scc.v1:mcdm.heroes.v1/complication/mundane) statue while you remain unmoving.
content: |-
    As a child, you met a creature who [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn) people to stone, such as a medusa. You escaped half petrified, avoiding the fate of others who stand as statues now.

    **Benefit:** You have a +1 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [stability](scc.v1:mcdm.heroes.v1/rule.character/stability). Additionally, you can use a [free maneuver](scc.v1:mcdm.heroes.v1/rule.combat/free-maneuver) to cause your body, gear, and any items you hold to take on the appearance of stone, making you appear to be a [mundane](scc.v1:mcdm.heroes.v1/complication/mundane) statue while you remain unmoving.

    **Drawback:** You have sonic weakness 5. Additionally, while you are [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), you are [dazed](scc.v1:mcdm.heroes.v1/condition/dazed).
drawback: You have sonic weakness 5. Additionally, while you are [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), you are [dazed](scc.v1:mcdm.heroes.v1/condition/dazed).
