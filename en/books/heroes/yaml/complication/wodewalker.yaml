benefit: Your [recovery value](scc.v1:mcdm.heroes.v1/rule.health/recoveries) increases by an amount equal to your highest [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) score.
content: |-
    You were dying in the wode, collapsing while starving and wounded. When you woke, you discovered that a group of green [elementalists](scc.v1:mcdm.heroes.v1/class/elementalist) had saved your life by infusing the regenerative bark of a tree to your body.

    **Benefit:** Your [recovery value](scc.v1:mcdm.heroes.v1/rule.health/recoveries) increases by an amount equal to your highest [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) score.

    **Drawback:** You have fire weakness 5.
drawback: You have fire weakness 5.
