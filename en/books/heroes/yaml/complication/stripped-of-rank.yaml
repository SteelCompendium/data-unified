benefit: You have the following ability.
content: "You were trained as an officer, but you no longer serve. Whether you fled from a battle, were dishonorably discharged, or defected from an evil army, you make your own way in the world now—though your military training will never truly leave you.\n\n**Benefit:** You have the following ability.\n\n##### Issue Order\n\n>\n> *\"Move or die, folks.\"*\n>\n> | **[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)**       | **Main action** |\n> |------------------|----------------:|\n> | **\U0001F4CF [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10** | **\U0001F3AF One ally** |\n>\n> **Effect:** The target can use a [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to take a main action, a maneuver, or a move action.\n>\n> **Special:** If you have the [Strike Now](scc.v1:mcdm.heroes.v1/feature.ability.tactician.level-1/strike-now) [tactician](scc.v1:mcdm.heroes.v1/class/tactician) ability, the target can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) instead of a [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to gain the benefit of this ability.\n\n**Drawback:** Rather than attracting [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) at 3, 6, 9, and 12 [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown), you can attract [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) only when your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) reaches 4, 8, 12, and 16. See [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards)."
drawback: 'Rather than attracting [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) at 3, 6, 9, and 12 [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown), you can attract [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) only when your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) reaches 4, 8, 12, and 16. See [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards).'
flavor: You were trained as an officer, but you no longer serve. Whether you fled from a battle, were dishonorably discharged, or defected from an evil army, you make your own way in the world now—though your military training will never truly leave you.
name: Stripped of Rank
