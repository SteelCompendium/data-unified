benefit: You have the following [heroic ability](scc.v1:mcdm.heroes.v1/rule.general/heroic-ability).
content: "In times of stress, you get headaches. Psionic energy builds up in your mind until you feel as though your head might explode. And if you're not careful, it actually does explode, radiating psychic waves that harm friends and enemies alike.\n\n**Benefit:** You have the following [heroic ability](scc.v1:mcdm.heroes.v1/rule.general/heroic-ability).\n\n> ###### Psychic Blast (Special Heroic Resource Cost)\n>\n> *Psionic energy [bursts](scc.v1:mcdm.heroes.v1/rule.combat/burst) from your body in an iridescent shimmer.*\n>\n> | **Area, Psionic** |                  **[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n> |-------------------|---------------------------------:|\n> | **\U0001F4CF 3 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)**    | **\U0001F3AF Each creature in the area** |\n>\n> **Effect:** Using this ability costs all your [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource).\n>\n> **[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + Your Highest [Characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) Score:**\n>\n> - **≤11:** 1 psychic damage for each [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) you spend, to a maximum equal to your level\n> - **12-16:** 1 psychic damage for each [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) you spend, to a maximum equal to your level + your highest [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic)\n> - **17+:** 1 psychic damage for each [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource) you spend\n\n**Drawback:** Whenever you become [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding), [frightened](scc.v1:mcdm.heroes.v1/condition/frightened), or [weakened](scc.v1:mcdm.heroes.v1/condition/weakened), you must use Psychic Blast as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action)."
drawback: Whenever you become [bleeding](scc.v1:mcdm.heroes.v1/condition/bleeding), [frightened](scc.v1:mcdm.heroes.v1/condition/frightened), or [weakened](scc.v1:mcdm.heroes.v1/condition/weakened), you must use Psychic Blast as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action).
flavor: In times of stress, you get headaches. Psionic energy builds up in your mind until you feel as though your head might explode. And if you're not careful, it actually does explode, radiating psychic waves that harm friends and enemies alike.
name: Psychic Eruption
