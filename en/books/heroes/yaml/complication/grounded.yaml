benefit: 'You have the 1st-level [Elementalist Specialization](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/elemental-specialization) feature [Motivate Earth](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/motivate-earth) (see Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes)). If you also gain this feature in any other way, the [Motivate Earth](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/motivate-earth) ability becomes a [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) ability for you with a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 5.'
content: |-
    Once when you were a child, your settlement was in danger and you called out to the earth for aid. That call was answered by a summoning of protective dirt-and-stone walls, and ever since then, you've felt the earth's presence as a friend and protector.

    **Benefit:** You have the 1st-level [Elementalist Specialization](scc.v1:mcdm.heroes.v1/feature.elementalist.level-1/elemental-specialization) feature [Motivate Earth](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/motivate-earth) (see Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes)). If you also gain this feature in any other way, the [Motivate Earth](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/motivate-earth) ability becomes a [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) ability for you with a [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) of [ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 5.

    **Drawback:** You attract lightning. Whenever any creature within 2 squares of you takes lightning damage, you take 5 lightning damage that can't be reduced in any way.
