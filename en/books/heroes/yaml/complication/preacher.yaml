benefit: 'As a [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) activity, you can attempt to convert members of a community to your cause. Make a [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) with a difficulty determined by the Director based on the community''s receptiveness to your ideas. On a success, you convert one [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) into a [follower](scc.v1:mcdm.heroes.v1/rule.general/follower) (see [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards)), which you gain in addition to any [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) acquired through [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) or other means. The Director determines the type of [follower](scc.v1:mcdm.heroes.v1/rule.general/follower). Once you have converted an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) into a [follower](scc.v1:mcdm.heroes.v1/rule.general/follower) this way, you can''t use this benefit again until you gain a level.'
content: |-
    When you were young, you almost died in an accident or attack, but a vision of a god or [saint](scc.v1:mcdm.heroes.v1/rule.world/saint) showed you the way to save yourself and others you loved. That event drove you into the church and gave you a strong belief in a particular religion or cause—and you can't wait to tell other people all about it.

    **Benefit:** As a [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) activity, you can attempt to convert members of a community to your cause. Make a [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) with a difficulty determined by the Director based on the community's receptiveness to your ideas. On a success, you convert one [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) into a [follower](scc.v1:mcdm.heroes.v1/rule.general/follower) (see [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) in Chapter 13: [Rewards](scc.v1:mcdm.heroes.v1/chapter/rewards)), which you gain in addition to any [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) acquired through [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) or other means. The Director determines the type of [follower](scc.v1:mcdm.heroes.v1/rule.general/follower). Once you have converted an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) into a [follower](scc.v1:mcdm.heroes.v1/rule.general/follower) this way, you can't use this benefit again until you gain a level.

    **Drawback:** If you fail in your conversion attempt, one of your existing [followers](scc.v1:mcdm.heroes.v1/rule.general/follower) of the Director's choice (whether gained through this complication or your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) or other means) leaves you, their faith in you shaken. If you have no [followers](scc.v1:mcdm.heroes.v1/rule.general/follower), your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) is reduced by 1. If you need to reduce your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) and it's already 0, you gain no benefits from the [respite](scc.v1:mcdm.heroes.v1/rule.resource/respite) during which you make the conversion attempt.
