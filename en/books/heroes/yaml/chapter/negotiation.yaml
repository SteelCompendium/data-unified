content: |-
    Negotiation gives the heroes a chance to get what they want without combat... or at least without further combat! You might negotiate with a king to obtain military support against an incursion of demons in a neighboring country. You could enter into talks with a bandit leader to convince her to stop attacking merchant caravans on the road, and instead target nobles loyal to a tyrant. You might attempt to convince an archmage to allow you access to their secret library so you can research the location of a dragon-slaying axe. Negotiation covers all these scenarios and more.

    Think of negotiation as something like learning a new system for combat, exploration, or investigation in an RPG. This set of rules provides a framework for roleplaying. The negotiation rules are meant to be read by players and Directors, so that both understand the rules of negotiation. If you've never played a game with a dedicated negotiation system like this, you might need to run it once or twice before you master it, similar to learning any new subsystem in an RPG. If a player hasn't read these rules, the Director and other players who have can explain them to that player during their first negotiation.

    Negotiation is a framework for important roleplaying encounters in which the heroes want to convince an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) to take a particular course of action, such as lending the heroes an artifact or pardoning a prisoner. This framework tracks the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) in the hero's arguments and their [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience), so that the Director know what the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) is willing to offer and when it's time to end the scene. This framework shouldn't replace roleplaying (though it certainly can if your group doesn't enjoy that part of RPGs). It's here to help players and Directors understand the structure of a give and take conversation and give some rules that can make a high-stakes conversation even more dramatic!

    ### When to Negotiate

    In order for a negotiation to occur, an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) must have an [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) in negotiating with the heroes—but must also have a reason to not simply jump on board with whatever the heroes propose. Negotiations happen only when an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) has that internal tension between [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) and reluctance. For example, if the characters ask a king to send his army into a neighboring kingdom to battle a demon incursion, the king needs to be conflicted. He wants to stop the incursion, but he doesn't want to risk the lives of his soldiers defending a foreign nation while leaving their own people unprotected. If the heroes want the help of the king's army, they need to negotiate.

    Heroes aren't expected to use the negotiation rules every time one character tries to convince an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) to see things their way. For instance, if a hero wants information about a cult leader from a captured cultist, a single [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) using the [Lie](scc.v1:mcdm.heroes.v1/skill.interpersonal/lie) skill or a [Might](scc.v1:mcdm.heroes.v1/rule.character/might) [test](scc.v1:mcdm.heroes.v1/rule.test/test) using [Intimidate](scc.v1:mcdm.heroes.v1/skill.interpersonal/intimidate) is likely all that's needed. A character who wants to flirt with the local alchemist to obtain a free Healing Potion likely just needs to make a [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) using the [Flirt](scc.v1:mcdm.heroes.v1/skill.interpersonal/flirt) skill.

    By contrast, negotiations typically involve all the heroes interacting with one or more important named [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) who can provide information, items, or services that dramatically change the course of an adventure. Often, this involves the heroes seeking an item of great power, a [retainer](scc.v1:mcdm.heroes.v1/rule.general/retainer) or companion, the services of an influential organization or nation, or a plot-twist-worthy piece of information. Convincing a lich to lend the party the legendary *Codex Mortis*, trying to convince a dragon to halt an attack on a wizard's tower, or talking the leaders of an enemy army into standing down means that a negotiation is in order.

    To negotiate successfully, the heroes must make persuasive arguments to convince [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) to do what they want. "Do it or we kill you" is a threat that might well accompany a single [Might](scc.v1:mcdm.heroes.v1/rule.character/might) [test](scc.v1:mcdm.heroes.v1/rule.test/test) using the [Intimidate](scc.v1:mcdm.heroes.v1/skill.interpersonal/intimidate) skill, but it's not a negotiating tactic.

    #### Limits of Negotiation

    Some players might instinctively feel that the negotiation rules should give them something akin to mind-control superpowers. They're not used to imagining [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) complexly, and might attempt to negotiate in situations where negotiation is either completely unreasonable or literally impossible. No matter how persuasive or well-spoken a hero is, there's no argument to be made that might convince the vile Lord Syuul to give up his pursuit of evil and become a gardener. A negotiation typically can't convince a queen to hand over her crown to the heroes and name them the new rulers of the land, or inspire a dragon to fork over every piece of treasure in their hoard. Negotiations only work when the heroes ask for something from an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) that the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) is willing to seriously consider giving them.

    **Negotiation is not a process that changes an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s character.** Rather, the heroes are trying to make an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) understand how behaving differently would be in character. You might well be able to get the hitherto loyal lieutenant of an evil boss to reconsider the error of their ways. That's a classic dramatic trope. But even then, you're not changing their character—you're convincing them that their current evil ways are out of character. "Is this who you are? Is this how you want to be remembered?!"

    If some players want to use the negotiation system as a means to an end by having their characters say, "Just do what we tell you, or else!", you can remind them that that's not how most people, including [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc), work. Any heroes who open with that attitude are likely to lose the negotiation before it begins.

    #### The Threat of Violence

    In the real world, negotiations rarely come with a threat of immediate violence. Ambassadors don't usually get into fistfights. But this is a heroic fantasy RPG, featuring heroes who are armed to the teeth and able to alter reality with their minds. The threat of violence is already implied. Everyone involved knows that the characters could draw steel at any moment.

    The Director typically assumes that the underlying potential for events to [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) violent is already factored into every negotiation. However, if the heroes decide to bring that threat to the forefront, then they've exited the realm of negotiation and have entered into a different type of relationship—and it's probably time to draw steel.

    Negotiation is about persuading someone to help you willingly because you've convinced them that meeting your [objectives](scc.v1:mcdm.heroes.v1/rule.combat/objective) is a good idea. Working with you is wise or logical, or might make them look good. A hero can absolutely threaten someone with violence and force them to do what they want, but this is an incredibly temporary state. A threatened [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) isn't willingly doing what they've been asked. They're doing it on threat of violence, and will comply only while that threat is evident—after which, they'll likely go back to their previous behavior as soon as they think they can get away with it.

    ### Negotiation Stats

    During negotiation, the Director assigns [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) four temporary statistics and features—[interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest), [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience), [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), and [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall). The heroes can strike a favorable deal if they maximize an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) by making arguments that invoke the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) and avoid their [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall)—but they have to do all that before the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) wears out.

    #### List of Motivations and Pitfalls

    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) can have any of the following twelve [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or pitfalls.

    ### Uncovering Motivations

    If a hero wishes to figure out an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), they can begin by simply asking, "What do you want out of this deal?" In response, the

    ###### Negotiation Starting Attitudes Table

    | Attitude   | Description                                                                                              | [Interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) | [Patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) |
    |------------|----------------------------------------------------------------------------------------------------------|----------|----------|
    | Hostile    | Openly opposed to the heroes. Barely willing to listen.                                                  | 1        | 2        |
    | Suspicious | Doubts the heroes' motives but is willing to listen.                                                     | 2        | 2        |
    | Neutral    | Doesn't feel one way or the other. Would probably rather be somewhere else, but doesn't want to be rude. | 2        | 3        |
    | Open       | Willing to listen, willing to help, as long as the heroes aren't asking too much.                        | 3        | 3        |
    | Friendly   | The heroes seem like the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s people. The [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) is willing to give them the benefit of the doubt.         | 3        | 4        |
    | Trusting   | The [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) has reason to take the heroes at their word and will help if the characters don't screw this up. | 3        | 5        |

    [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) can willingly hint at or reveal one of their [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), usually by asking for something. For instance, a monarch [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with the [greed](scc.v1:mcdm.heroes.v1/negotiation/greed) [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) and a penchant for collecting rare animals might suggest that the heroes retrieving a griffon egg would earn the monarch's gratitude. The Director can also decide that during the natural course of the negotiation, the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) might offer up similar suggestions without the heroes asking, provided the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) already has an [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) of 3 or higher.

    If an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) isn't as forthcoming, or if the heroes want to learn one of the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall), a hero can make a [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition), or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) while interacting with the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) during the negotiation, based on the tactics used to draw out the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc). The [test](scc.v1:mcdm.heroes.v1/rule.test/test) has the following outcomes:

    **[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason), [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition), or [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence):**

    - **≤11:** The hero learns no information regarding the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall), and the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) realizes the hero is trying to read them and becomes annoyed. As a consequence, the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) is reduced by 1.
    - **12-16:** The hero learns no information regarding the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall).
    - **17+:** The hero learns one of the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) (their choice).

    After this [test](scc.v1:mcdm.heroes.v1/rule.test/test) is made, the heroes can't make another [test](scc.v1:mcdm.heroes.v1/rule.test/test) to determine the same [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) until they make an argument to the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) or the negotiation ends.

    #### Outside of Negotiation

    While the heroes can discover an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) through [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made during negotiation, they can employ other methods of investigating [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) or [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) before negotiation. Research or a little reconnaissance (for instance, reading the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s diary or talking to their closest friends) can reveal quite a bit about a person!

    ### Keep Going or Stop

    If an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) still has [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) after making an offer and their [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) is between 1 and 4, the heroes can make another argument to attempt to improve the deal. Alternatively, they can accept the offer and end the negotiation. Let the players drive this decision. You can always have an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) show they have [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) remaining by asking, "Is there anything else?"

    If the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) is 0 or their [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) is 5, then the offer the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) makes is their final offer to the characters. The heroes can accept the offer or not, but either way, the negotiation ends.

    If the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) is 0, the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) ends the negotiation without accepting a deal. The heroes can walk away from a negotiation without accepting a deal at any time.

    ### Sample Negotiation

    After killing the true lord of Bedegar, the tyrannical Lord Saxton took over the barony's capital, and is presently gathering forces to march on the rest of Bedegar's settlements. The heroes recently saved Edmund, the true heir to Bedegar's throne, and are now attempting to build an army that can stand against Saxton and defeat the tyrant.

    The heroes are engaging in a negotiation with Zola Honeycut, the [human](scc.v1:mcdm.heroes.v1/ancestry/human) guildmaster of the Clock—a thieves' guild whose headquarters is located in Bedegar's capital. The guild openly opposed Saxton when he first seized power, but the tyrant was quick to crack down on all known members of the Clock, forcing them into hiding or hanging them as a warning to others. The heroes' hope is that they can convince Zola to support their armed resistance.

    #### Zola's Negotiation Stats

    Zola is neutral toward the heroes when the negotiation begins. She knows them only by reputation, though she understands that they too believe Saxton is a tyrant who must be stopped. However, standing up to that tyrant has cost her people dearly, and she's not sure she's ready to rejoin the fight. One wrong move could spell the end of the Clock!

    > **Zola Honeycut Negotiation Stats**
    >
    > - **[Interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest): 2**
    > - **[Patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience): 4**
    > - **Impression: 3**
    >
    > ###### Motivations
    >
    > **Benevolence:** Zola's name, Honeycut, comes from the fact that she always gives her fellow thieves a bigger cut than her own on jobs.
    >
    > **Protection:** The members of the Clock are the only family Zola's ever known. The guild's motto is "The Clock is always ticking," because they're always planning the next job and their ever-richer future. Zola doesn't want to be the guild's last master.
    >
    > ###### Pitfall
    >
    > **Higher Authority:** Zola has no [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) in serving anyone other than herself, and she scoffs at the suggestion of taking orders.
    >
    > **Revelry:** Zola is all business and has no time for frivolity, especially while living under Saxton's threat.

    #### Roleplaying Zola

    Zola is glad that people are finally opposing Lord Saxton, but is angry that no one rose up with the Clock months ago when the tyrant first staged his coup. She's passionate about protecting her people, quick to call out dangerous plans in arguments she doesn't like, and fast to praise statements she agrees with. She's not afraid to speak her mind to the heroes, knowing that they share her desire to see Saxton gone. She's just not sure she can risk more of her found family in the current fight.

    #### Negotiation in Action

    Here's how the negotiation with Zola might play out.

    **Director (Djordi):** *The windows are boarded up, allowing no light to enter the seemingly abandoned Goat's Eye tavern. The whole place smells of charred wood, evidence of the fire that burned most of the building's interior three years ago. As the door shuts behind you, light from a hooded lantern on the opposite side of the tavern suddenly fills the room. Amid the blackened walls and pillars, you note where six burly ruffians flank your group on both sides. The [human](scc.v1:mcdm.heroes.v1/ancestry/human) holding the lantern smiles. "Welcome. I'm Zola. Willoughby told me you were coming. Have a seat." She motions to a few crates ar[ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) in a circle around a wide barrel.*

    **James (playing Korvo, a [shadow](scc.v1:mcdm.heroes.v1/class/shadow)):** *I have a seat and say, "Korvo at your service, Ms. Honeycut. And these here are the finest companions a [polder](scc.v1:mcdm.heroes.v1/ancestry/polder) could ask for: Linn, Jorn, and Val."*

    **Director:** *Zola nods to each of you in turn, then says, "You'll excuse me if I dispense with more pleasantries. These days, no place is safe for the Clock. We keep moving. So tell me, what are you here for?"*

    **Alyssa (playing Jorn, a [tactician](scc.v1:mcdm.heroes.v1/class/tactician)):** *"We're building an army to take down Saxton once and for all."*

    In this scenario, all the heroes have a [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) of 2 except for Jorn, who has a [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) of 3 and is therefore famous to Zola.

    **Director:** *Zola gives a mirthless chuckle as she shakes her head. "Oh is that all? I have to tell you, I don't think the four of you stand much of a chance. Unless you're hiding a legion or two of [dwarves](scc.v1:mcdm.heroes.v1/ancestry/dwarf) in your pockets. Yes, you have Jorn the Mighty with you, but you'll need more than one famous warrior to win the day."*

    **Alyssa:** *Ah! So she has heard of me at least! Thanks, [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown).*

    **Grace (playing Val, a [conduit](scc.v1:mcdm.heroes.v1/class/conduit)):** *"We don't. But we do have Lord Edmund—the true heir to the Bedegar throne."*

    **Director:** *Zola nods, impressed. "I'm glad the boy is safe, but that's all he is—a boy, not an army."*

    **Matt (playing Linn, a [talent](scc.v1:mcdm.heroes.v1/class/talent)):** *"He's a boy people will rally around. We have no army, but that's why we're here. We're planning on changing that. Can you spare any soldiers for our cause?"*

    The negotiation officially starts. The heroes have stated what they want from Zola. The Director begins by prompting them to make an argument.

    **Director:** *Zola leans back on her crate. "There it is. The Clock has sacrificed much against Saxton. Why should we risk more to help? No one was here to help us months ago when we stood up to tyranny."*

    **Alyssa:** *I nod along as Zola speaks, listening before I say, "We didn't hear of your struggle until after Saxton had already hanged many of your brave people. We're here now. How can we help?"*

    Before making an argument, Alyssa is attempting to learn what Zola's [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) are by simply asking. The Director decides to reveal one of Zola's [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation): protection.

    **Director:** *"If I were to make a deal with you, and that's a big 'if,' I'd need assurances that you can end this. Proof would be even better. The protection of my people is my top priority. We can earn freedom from Saxton once we regain our strength."*

    **James:** *Aha! I got this, folks. I stand atop my crate and say, "Well, we can surely offer that, Ms. Honeycut. We have convinced Lord Edmund to*

    *grant amnesty to any who swear to serve him." I'd like to roll a [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test) to convince her.*

    **Director:** *Hold it there, champ. Zola's eyes narrow as you speak, and she holds up a hand to cut you off. "I will not swear to serve any ruler, no matter how benevolent. I'll consider being a partner, but even that outlook is grim if you tell me again that I need to bend the knee."*

    Korvo inadvertently made an argument using a [pitfall](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) by appealing to a higher authority. The Director notes that Zola's [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) drops to 1 and her [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) drops to 3. Zola gave a pretty firm "No" response here, which is what an [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with an [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) of 1 would say. However, the Director phrased Zola's response in such a way that the heroes know they can keep making arguments if they wish, since her [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) hasn't run out.

    **James:** *Sorry! I thought that'd work. Seems like higher authority is a [pitfall](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) for her*.

    **Grace:** *Let's try to avoid any others. Val says, "We're sorry, Zola. We don't want to do anything else to offend you." I'd like to make an [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) [test](scc.v1:mcdm.heroes.v1/rule.test/test) and use my Read Person skill to gauge her reaction and try to discern any other [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall).*

    **Director:** *Cool. Hard difficulty.*

    **Grace:** *I got a 17! Success.*

    **Director:** *Zola sits back, chuckling. "There's two things I can't stand anyone telling me to kiss a ring and merry fools who would rather go drinking than fight for their freedom. Luckily, you're not the latter." You can tell that revelry also won't go over well with Zola.*

    The heroes now know both of Zola's [pitfalls](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall): higher authority and revelry.

    **Matt:** *Linn is going to say, "We're recruiting more than just the Clock. We have a good chance of recruiting the elves of the wode and the [orcs](scc.v1:mcdm.heroes.v1/ancestry/orc) of Forest Rend, and we're already training the people of Gravesford to put up a fight. If we strike before Saxton can fully build his forces, we all stand a better chance of survival. If you don't stand with us, Saxton will still come for you. He's already coming for you. The Clock stands less of a chance alone."*

    **Director:** *I think that's a [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) [test](scc.v1:mcdm.heroes.v1/rule.test/test), since you're using logic to point out that you have a better chance together than on your own. It's easy too, since you're appealing to one of her [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation).*

    **Matt:** *Great! Can I use Lead here, since I'm demonstrating our ability to bring people together?*

    **Director:** *I'll allow it.*

    **Matt:** *That's a 14!*

    Because Linn appealed to a [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), Zola's [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) increases to 2, and her [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) drops to 2. The Director gives a "No, but..." response based on Zola's [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest). At this point, the heroes haven't promised anything, so she offers them something for free.

    **Director:** *Zola nods along as you speak. "You're correct, but I'm not sure I can spare the people. I'll tell you what I can do. I have spies watching Saxton still. I can give you information about his troops' movements. Will that suffice?"*

    The Director makes it clear in Zola's response that the negotiation can still continue if that's what the players want.

    **Alyssa:** *I don't think so, right?*

    **James:** *No. We need an army.*

    **Matt:** *Yeah, let's push it.*

    **Grace:** *Agreed.*

    **Alyssa:** *I wonder if we can try to figure out another one of her [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation).*

    **James:** *Is there anything I know about Zola's reputation? I have the Criminal Underworld skill.*

    **Director:** *Make a [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) [test](scc.v1:mcdm.heroes.v1/rule.test/test).*

    **James:** *That's an 18! Success!*

    **Director:** *Korvo would know that Zola got the name Honeycut because she's generous with the guild's earnings. She gives all her fellow thieves a nice cut of every job.*

    Korvo's success has revealed Zola's benevolence [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation).

    **James:** *Brilliant! I think I probably would've shared that with the group before this.*

    **Director:** *Yeah, that makes sense.*

    **Alyssa:** *Great. Jorn will say, "It would be worthwhile in other ways for your crew if you joined our side."*

    **Director:** *Zola's [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) is piqued. "What makes you say that?"*

    **Alyssa:** *"Even before his coup, Saxton had a considerable amount of wealth. If he's deposed, those riches need to go somewhere. The Clock will get a cut—a honey of a cut, you might say. Edmund has also promised to share his family's fortune with any who stand with him against Saxton—no oath of fealty necessary. After the young lord reclaims the throne, that is."*

    **Director:** *You're appealing to one of her [motivations](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), so make a [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [test](scc.v1:mcdm.heroes.v1/rule.test/test).*

    **Alyssa:** *Can I use my [Persuade](scc.v1:mcdm.heroes.v1/skill.interpersonal/persuade) skill too?*

    **Director:** *Absolutely. And you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) because you're famous to her.*

    **Alyssa:** *I needed that [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge). I got a 12!*

    Because Jorn appealed to a [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation), Zola's [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) increases to 3, and her [patience](scc.v1:mcdm.heroes.v1/rule.negotiation/patience) is reduced to 1. The Director gives a "Yes, but..." response while making it clear that the negotiation can still continue.

    **Director:** *Zola contemplates this for a moment. She nods, "I'm starting to see the benefits. I think I can spare some folks to help you, but you have to help them first. See, my best warriors are locked up in Bedegar Keep. They're supposed to be hanged in two days. If you free them, I'll see to it they stand with you against Saxton. We were making a plan to free them ourselves but could frankly use the help."*

    **Grace:** *We could push the Clock to do it themselves, but I can't see Val turning her back on people in need.*

    **James:** *Hear, hear. I'm done pushing my luck on this one.*

    **Matt:** *It'll mean less time to recruit the other troops, so we'd better work quickly.*

    **Alyssa:** *Then we're in agreement. I offer a handshake to Zola. "You've got yourself a deal."*

    The heroes could have pushed for a better deal, but they're satisfied with the offer from Zola, so they accept her terms. The negotiation ends.
