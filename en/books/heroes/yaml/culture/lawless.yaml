content: |-
    Your hero grew up among folk who performed activities that other people—whether within or outside their culture—considered unlawful. A band of pirates, a guild of assassins, or an organization of spies all commit unlawful acts for money. And under tyranny, people engaged in rebellion are often considered [lawless](scc.v1:mcdm.heroes.v1/culture/lawless) in their actions and activities. People brought up in a [lawless](scc.v1:mcdm.heroes.v1/culture/lawless) culture typically don't mind breaking the rules when it suits them—and are good at making sure no one finds out they did.

    **Skill Options:** One skill from the [intrigue skill group](scc.v1:mcdm.heroes.v1/skill.group/intrigue). (*Quick Build:* [Sneak](scc.v1:mcdm.heroes.v1/skill.intrigue/sneak).)
