content: |-
    A [nomadic](scc.v1:mcdm.heroes.v1/culture/nomadic) culture travels from place to place to survive. Members of a [nomadic](scc.v1:mcdm.heroes.v1/culture/nomadic) culture might follow animal migrations or the weather, travel to sell their wares or services, or simply enjoy a restless lifestyle full of new experiences and peoples. Those who grow up in [nomadic](scc.v1:mcdm.heroes.v1/culture/nomadic) cultures learn to navigate the wilderness and work closely with others to survive.

    **Skill Options:** One skill from the [exploration](scc.v1:mcdm.heroes.v1/skill.group/exploration) or [interpersonal](scc.v1:mcdm.heroes.v1/skill.group/interpersonal) skill groups. (*Quick Build:* [Navigate](scc.v1:mcdm.heroes.v1/skill.exploration/navigate).)
