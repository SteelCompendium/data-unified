alignment: good
content: |-
    **Domains:** Creation, Knowledge, Life, Nature, Protection

    Val, the Noble Lord, First Among Equals, is the patron of the elves. He created the celestials—the true elves, second of the five speaking peoples—who then created the younger elves: the high, wode, and shadow elves. His name is the root of the Caelian word "valiant," and the [dwarves](scc.v1:mcdm.heroes.v1/ancestry/dwarf) named the most precious ore in [Orden](scc.v1:mcdm.heroes.v1/rule.world/orden)—Valiar, the truemetal—after him.

    Val holds that the greatest purpose a thinking being can commit themselves to is the creation of art and the appreciation of beauty. He keeps the magical, elf-haunted forests called wodes close to his heart because they represent his vision for [Orden](scc.v1:mcdm.heroes.v1/rule.world/orden). What the world could have been. His growing disgust with the concept of war led him to leave [Orden](scc.v1:mcdm.heroes.v1/rule.world/orden) and take up residence in his private manifold, *Arcadia* where all elves hope to someday join their patron.

    #### Heroes of the Elves

    The legendary heroes of the elves are once-mortal heroes who now dwell in Arcadia and make up Val's court there. They answer prayers and dispense blessings and boons, even manifest in the world during times of great need. (Though, like all the speaking people's [saints](scc.v1:mcdm.heroes.v1/rule.world/saint) and heroes, what these legendary figures consider "great need" is very personal and has little to do with politics or great kingdoms.)

    The [high elf](scc.v1:mcdm.heroes.v1/ancestry/high-elf) heroes detailed in this book are A Sea of Suns, the Taste of Morning, and Ripples of Honey on a Shore of Gold. The [wode elf](scc.v1:mcdm.heroes.v1/ancestry/wode-elf) heroes are Yllin Dyrvis, Thyll Hylacae, and Illwyv li Orchiax.
