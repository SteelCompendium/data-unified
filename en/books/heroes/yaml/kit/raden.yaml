content: "With this stormwight kit, you channel your [primordial ferocity](scc.v1:mcdm.heroes.v1/feature.fury.level-10/primordial-ferocity) into the form of a rat, becoming mobile and elusive. [Raden](scc.v1:mcdm.heroes.v1/kit/raden) are associated with the wild nature of the rat, before cities became their habitat. This aspect is associated with the rat flood—a surge of corrupted water that draws forth hordes of rats.\n\n##### Signature Ability\n\n###### Driving Pounce\n\n*Your enemies try in vain to fall back from your pouncing attack.*\n\n| **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), [Strike](scc.v1:mcdm.heroes.v1/rule.combat/strike), Weapon** |               **Main action** |\n|---------------------------|------------------------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**            | **\U0001F3AF One creature or object** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility):**\n\n- **≤11:** 4 + A damage\n- **12-16:** 7 + A damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 1\n- **17+:** 9 + A damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 2\n\n**Effect:** You can [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to the same number of squares that you [pushed](scc.v1:mcdm.heroes.v1/movement/forced-movement) the target."
flavor: With this stormwight kit, you channel your primordial ferocity into the form of a rat, becoming mobile and elusive. Raden are associated with the wild nature of the rat, before cities became their habitat. This aspect is associated with the rat flood—a surge of corrupted water that draws forth hordes of rats.
