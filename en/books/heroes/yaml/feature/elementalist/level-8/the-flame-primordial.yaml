effects:
    - effect: |-
        You produce a fire that entrances the fates, distracting them from aiding your foes. Whenever you deal fire damage to a creature or object, they take an extra 1d6 fire damage. If you deal fire damage to a mundane object, you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to target it with your [Return to Formlessness](scc.v1:mcdm.heroes.v1/feature.ability.elementalist.level-1/return-to-formlessness) ability instead.

        Additionally, any enemy who starts their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to you has fire weakness equal to your [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) score until the start of their next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn). This increases to twice your [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason) score if the enemy is made of or is wearing mostly metal.
