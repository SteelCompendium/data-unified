ability:
    distance: '[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1'
    effects:
        - roll: Power Roll + [Might](scc.v1:mcdm.heroes.v1/rule.character/might)
          tier1: No effect.
          tier2: You can grab the target, but if you do, the target can make a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against you before they are [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).
          tier3: The target is [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) by you.
        - effect: You can usually target only creatures of your [size](scc.v1:mcdm.heroes.v1/rule.character/size) or smaller. If your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score is 2 or higher, you can target any creature with a [size](scc.v1:mcdm.heroes.v1/rule.character/size) equal to or less than your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score.
          name: Effect
    feature_type: ability
    keywords:
        - '[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee)'
        - Weapon
    metadata:
        action_type: '[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)'
        content: "\n| **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), Weapon** |        **[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|-------------------|--------------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**    | **\U0001F3AF One creature** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc.v1:mcdm.heroes.v1/rule.character/might):**\n\n- **≤11:** No effect.\n- **12-16:** You can grab the target, but if you do, the target can make a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against you before they are [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed).\n- **17+:** The target is [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) by you.\n\n**Effect:** You can usually target only creatures of your [size](scc.v1:mcdm.heroes.v1/rule.character/size) or smaller. If your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score is 2 or higher, you can target any creature with a [size](scc.v1:mcdm.heroes.v1/rule.character/size) equal to or less than your [Might](scc.v1:mcdm.heroes.v1/rule.character/might) score.\n\nUnless otherwise indicated, a creature can grab only one creature at a time.\n\nSee [Conditions](scc.v1:mcdm.heroes.v1/rule.combat/condition) in Chapter 5: [Classes](scc.v1:mcdm.heroes.v1/chapter/classes) for information on the [grabbed](scc.v1:mcdm.heroes.v1/condition/grabbed) [condition](scc.v1:mcdm.heroes.v1/rule.combat/condition)."
        distance: '[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1'
        feature_type: ability
        item_id: grab
        item_name: Grab
        keywords:
            - '[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee)'
            - Weapon
        target: One creature
        type: feature/ability/common
    name: Grab
    target: One creature
    type: feature
    usage: '[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)'
effects:
    - effect: A creature seeking to keep a foe close and locked down can attempt to grab a creature using the following ability.
