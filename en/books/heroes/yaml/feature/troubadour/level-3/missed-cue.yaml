effects:
    - effect: If you aren't [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised) at the start of an encounter, you can choose one enemy within your [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect) who is not a leader or solo creature. The Director temporarily removes the chosen creature from the encounter. The chosen creature enters the encounter at the start of the second [combat round](scc.v1:mcdm.heroes.v1/rule.combat/combat-round). You must earn 3 [Victories](scc.v1:mcdm.heroes.v1/rule.resource/victories) before you can use this feature again.
