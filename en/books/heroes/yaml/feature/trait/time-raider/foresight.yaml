cost: 1 Point
effects:
    - effect: Your senses extend past mundane obscuration and the veil of the future alike. You automatically know the location of any creature with [concealment](scc.v1:mcdm.heroes.v1/rule.combat/concealment) who isn't hidden from you within 20, and you negate the usual [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on [strikes](scc.v1:mcdm.heroes.v1/rule.combat/strike) against such creatures. Additionally, whenever you are targeted by a [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike), you can use a [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to impose a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on the [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll).
feature_type: trait
