effects:
    - effect: Your divine spark grows in power, allowing you and your allies to focus and endure. At the start of each of your [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn), you can spend 1d6 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) to end one effect on you that is ended by a [saving throw](scc.v1:mcdm.heroes.v1/rule.general/saving-throw) or that ends at the end of your [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn). Any ally who starts their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) within 5 squares of you can also spend [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) to gain this benefit.
