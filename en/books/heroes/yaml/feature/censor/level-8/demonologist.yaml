effects:
    - effect: The most esoteric secrets of your order teach you that to defeat your enemy, you must understand them. You treat your [Renown](scc.v1:mcdm.heroes.v1/rule.resource/renown) as 2 higher than usual when dealing with demons, [devils](scc.v1:mcdm.heroes.v1/ancestry/devil), and other agents of chaos. If you successfully complete a negotiation with one of these creatures, you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [power rolls](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) made against them and can use your [Judgment](scc.v1:mcdm.heroes.v1/feature.ability.censor.level-1/judgment) ability against them as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) before an encounter begins.
