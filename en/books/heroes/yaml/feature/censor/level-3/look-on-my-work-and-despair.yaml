effects:
    - effect: Your [judgment](scc.v1:mcdm.heroes.v1/feature.ability.censor.level-1/judgment) has grown in [divine power](scc.v1:mcdm.heroes.v1/feature.conduit.level-10/divine-power), instilling fear in those you condemn. Whenever you use your [Judgment](scc.v1:mcdm.heroes.v1/feature.ability.censor.level-1/judgment) ability, you can spend 1 wrath, and if the target has P < AVERAGE, they are [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) of you (save ends). Additionally, whenever a creature judged by you is reduced to 0 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) and you use [Judgment](scc.v1:mcdm.heroes.v1/feature.ability.censor.level-1/judgment) as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action), if the new target has P < STRONG, they are [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) of you (save ends). If the target is already [frightened](scc.v1:mcdm.heroes.v1/condition/frightened) of you, they instead take holy damage equal to twice your [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) score.
