effects:
    - effect: If you're not [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised) at the start of your first [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) in combat, you gain an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [ability rolls](scc.v1:mcdm.heroes.v1/rule.dice/ability-roll) and gain 2 [surges](scc.v1:mcdm.heroes.v1/rule.resource/surge). If you are [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised), you can spend 3 discipline to no longer be [surprised](scc.v1:mcdm.heroes.v1/rule.combat/surprised) and gain the benefits of this feature.
