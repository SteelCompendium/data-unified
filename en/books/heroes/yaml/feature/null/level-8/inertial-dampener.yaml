effects:
    - effect: You and each creature or object of your choice in the area of your [Null Field](scc.v1:mcdm.heroes.v1/feature.null.level-1/null-field) ability gain a [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [stability](scc.v1:mcdm.heroes.v1/rule.character/stability) equal to your [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score. A creature who attempts to [force move](scc.v1:mcdm.heroes.v1/movement/forced-movement) a target with this [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) takes psychic damage equal to your [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score.
