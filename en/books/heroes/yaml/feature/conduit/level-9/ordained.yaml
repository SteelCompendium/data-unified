effects:
    - effect: Your god elevates the power flowing through you. Your [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores are treated as 1 higher for the purpose of resisting [potencies](scc.v1:mcdm.heroes.v1/rule.character/potency). Additionally, while you have 5 or more [Victories](scc.v1:mcdm.heroes.v1/rule.resource/victories), you speak with the voice of your deity. You have a double [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) on [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) [tests](scc.v1:mcdm.heroes.v1/rule.test/test) made to influence other creatures.
