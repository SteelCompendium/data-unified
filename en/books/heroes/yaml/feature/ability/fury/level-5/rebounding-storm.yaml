    action_type: '[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)'
    class: fury
    content: "\n*You knock around enemies like playthings.*\n\n| **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), [Strike](scc.v1:mcdm.heroes.v1/rule.combat/strike), Weapon** |                 **[Main action](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|---------------------------|--------------------------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**            | **\U0001F3AF Two creatures or objects** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc.v1:mcdm.heroes.v1/rule.character/might):**\n\n- **≤11:** 9 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 3\n- **12-16:** 14 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 5\n- **17+:** 19 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 7\n\n**Effect:** When a target would end this [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) by colliding with a creature or object, they take damage as usual, then are [pushed](scc.v1:mcdm.heroes.v1/movement/forced-movement) the remaining [distance](scc.v1:mcdm.heroes.v1/rule.combat/distance) away from the creature or object in the direction they came from. As long as [forced movement](scc.v1:mcdm.heroes.v1/movement/forced-movement) remains, this effect continues if the target collides with another creature or object."
