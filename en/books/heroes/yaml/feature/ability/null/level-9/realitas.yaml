cost: 11 Discipline
distance: '[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1'
effects:
    - roll: Power Roll + [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility)
      tier1: 7 + A psychic damage; I < WEAK, [dazed](scc.v1:mcdm.heroes.v1/condition/dazed)
      tier2: 10 + A psychic damage; I < AVERAGE, [dazed](scc.v1:mcdm.heroes.v1/condition/dazed)
      tier3: 13 + A psychic damage; I < STRONG, [dazed](scc.v1:mcdm.heroes.v1/condition/dazed)
    - effect: While [dazed](scc.v1:mcdm.heroes.v1/condition/dazed) this way, the target takes psychic damage equal to twice your [Intuition](scc.v1:mcdm.heroes.v1/rule.character/intuition) score at the start of each of your [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn). If this ability causes a creature who is not a leader or solo creature to become [winded](scc.v1:mcdm.heroes.v1/rule.health/winded), they are instead reduced to 0 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina). Any creature reduced to 0 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) by this ability is forgotten by all creatures of your level or lower in the timescape who are not present in the encounter. Loved ones of the forgotten creature retain a faint sense of melancholy. This effect can be reversed only at the Director's discretion.
