cost: 11 Piety
distance: '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10'
effects:
    - effect: The target can spend any number of [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries), can end any effects on them that are ended by a [saving throw](scc.v1:mcdm.heroes.v1/rule.general/saving-throw) or that end at the end of their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), and can stand up if they [are prone](scc.v1:mcdm.heroes.v1/condition/prone). Additionally, at the start of each of their [turns](scc.v1:mcdm.heroes.v1/rule.combat/turn) until the end of the encounter or until they are [dying](scc.v1:mcdm.heroes.v1/rule.health/dying), the target gains 3 [surges](scc.v1:mcdm.heroes.v1/rule.resource/surge).
