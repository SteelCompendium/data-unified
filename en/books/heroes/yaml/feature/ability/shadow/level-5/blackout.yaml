effects:
    - effect: A black cloud fills the area until the end of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), granting you and your allies [concealment](scc.v1:mcdm.heroes.v1/rule.combat/concealment) against enemies. While you are in the area, whenever an enemy ends their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn) in the area, you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to [shift](scc.v1:mcdm.heroes.v1/movement/shifting) to a new location within the area and make a [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against them.
