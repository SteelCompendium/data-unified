    content: "\n*You focus your allies' wrath on a chosen foe.*\n\n| **[Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee), [Strike](scc.v1:mcdm.heroes.v1/rule.combat/strike), Weapon** |   **Main action** |\n|---------------------------|------------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 1**            | **\U0001F3AF One creature** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Might](scc.v1:mcdm.heroes.v1/rule.character/might):**\n\n- **≤11:** 8 + M damage; as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action), one ally within 10 squares of the target can use a [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) [signature ability](scc.v1:mcdm.heroes.v1/rule.combat/signature-ability) against the target\n- **12-16:** 12 + M damage; as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action), one ally within 10 squares of the target can use a [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) [signature ability](scc.v1:mcdm.heroes.v1/rule.combat/signature-ability) that gains an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) against the target\n- **17+:** 16 + M damage; as a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action), two allies within 10 squares of the target can each use a [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) [signature ability](scc.v1:mcdm.heroes.v1/rule.combat/signature-ability) that gains an [edge](scc.v1:mcdm.heroes.v1/rule.dice/edge) against the target\n\n**Effect:** Each ally can [shift](scc.v1:mcdm.heroes.v1/movement/shifting) up to 2 squares and gains 2 [surges](scc.v1:mcdm.heroes.v1/rule.resource/surge) before making the [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike)."
