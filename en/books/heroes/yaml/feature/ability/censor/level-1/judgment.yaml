metadata:
    action_type: Maneuver
    class: censor
    content: "\n*You utter a prayer that outlines your foe in holy energy.*\n\n| **Magic, [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)** |     **Maneuver** |\n|-------------------|-----------------:|\n| **\U0001F4CF [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10**  | **\U0001F3AF One enemy** |\n\n**Effect:** The target is judged by you until the end of the encounter, you use this ability again, you willingly end this effect (no action required), or another [censor](scc.v1:mcdm.heroes.v1/class/censor) judges the target.\n\nWhenever a creature judged by you uses a main action and is within your [line of effect](scc.v1:mcdm.heroes.v1/rule.combat/line-of-effect), you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to deal holy damage equal to twice your [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence) score to them.\n\nWhen a creature judged by you is reduced to 0 [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina), you can use a free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) to use this ability against a new target.\n\nAdditionally, you can spend 1 wrath to take one of the following free [triggered actions](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action):\n\n- When an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) creature judged by you starts to [shift](scc.v1:mcdm.heroes.v1/movement/shifting), you make a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) [free strike](scc.v1:mcdm.heroes.v1/feature.common.main-actions/free-strike) against them and their [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) becomes 0 until the end of the current [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn), preventing them from [shifting](scc.v1:mcdm.heroes.v1/movement/shifting).\n- When a creature judged by you within 10 squares makes a [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll), you cause them to take a [bane](scc.v1:mcdm.heroes.v1/rule.dice/bane) on the roll.\n- When a creature judged by you within 10 squares uses an ability with a [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) that targets only one creature, the [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) is reduced by 1 for that creature.\n- If you damage a creature judged by you with a [melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) ability, the creature is [taunted](scc.v1:mcdm.heroes.v1/condition/taunted) by you until the end of their next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn).\n  \nYou can choose only one free [triggered action](scc.v1:mcdm.heroes.v1/rule.combat/triggered-action) option at a time, even if multiple options are triggered by the same effect."
    distance: '[Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10'
