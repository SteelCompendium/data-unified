    content: "\n*You reshape the flow of time in the target's body to return it to an earlier state.*\n\n| **Chronopathy, Psionic, [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged)** |            **[Maneuver](scc.v1:mcdm.heroes.v1/rule.combat/turn)** |\n|----------------------------------|------------------------:|\n| **\U0001F4CF [Ranged](scc.v1:mcdm.heroes.v1/rule.combat/ranged) 10**                 | **\U0001F3AF Self or one ally** |\n\n**Effect:** Choose two of the following effects:\n\n- The target can spend any number of [Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries).\n- The target gains 1 of their [Heroic Resource](scc.v1:mcdm.heroes.v1/rule.resource/heroic-resource), and can end any effects on them that are ended by a [saving throw](scc.v1:mcdm.heroes.v1/rule.general/saving-throw) or that end at the end of their [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn).\n- The target gains 2 [surges](scc.v1:mcdm.heroes.v1/rule.resource/surge), and gains a +3 [bonus](scc.v1:mcdm.heroes.v1/rule.dice/bonuses-and-penalties) to [speed](scc.v1:mcdm.heroes.v1/rule.character/speed) until the end of the encounter.\n\n**Strained:** You and the target both permanently grow visibly younger (the equivalent of 20 [human](scc.v1:mcdm.heroes.v1/ancestry/human) years, to the minimum of an 18-year-old). Additionally, you are [weakened](scc.v1:mcdm.heroes.v1/condition/weakened) and [slowed](scc.v1:mcdm.heroes.v1/condition/slowed) (save ends)."
