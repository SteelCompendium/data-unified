    content: "\n*Unbridled psionic energy erupts from your body and flashes outward, hurling your foes back.*\n\n| **Area, Psionic, Telekinesis** |                          **Main action** |\n|--------------------------------|-----------------------------------------:|\n| **\U0001F4CF 3 [burst](scc.v1:mcdm.heroes.v1/rule.combat/burst)**                 | **\U0001F3AF Each enemy and object in the area** |\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Reason](scc.v1:mcdm.heroes.v1/rule.character/reason):**\n\n- **≤11:** 6 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 7\n- **12-16:** 9 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 10\n- **17+:** 13 damage; [push](scc.v1:mcdm.heroes.v1/movement/forced-movement) 15\n\n**Effect:** On a [critical hit](scc.v1:mcdm.heroes.v1/rule.combat/critical-hit), the size of the area increases by 3, and this ability deals an extra 10 damage.\n\n**Strained:** You are [weakened](scc.v1:mcdm.heroes.v1/condition/weakened) (save ends). If you scored a [critical hit](scc.v1:mcdm.heroes.v1/rule.combat/critical-hit) with this ability, you die."
