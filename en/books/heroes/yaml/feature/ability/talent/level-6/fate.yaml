    content: "\n*Your foe gets a glimpse of how it will end for them.*\n\n| **Chronopathy, Psionic, [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee)** |  **Main action** |\n|---------------------------------|-----------------:|\n| **\U0001F4CF [Melee](scc.v1:mcdm.heroes.v1/rule.combat/melee) 2**                  | **\U0001F3AF One enemy** |\n\n**Effect:** The target has [damage weakness](scc.v1:mcdm.heroes.v1/rule.damage/damage-weakness) 5 until the end of your next [turn](scc.v1:mcdm.heroes.v1/rule.combat/turn). Whenever the target takes damage while they have this weakness, they are [knocked prone](scc.v1:mcdm.heroes.v1/condition/prone).\n\n**Strained:** This ability gains the [Strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) keyword as the vision hurts the target's psyche. You make a [power roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll), then are [weakened](scc.v1:mcdm.heroes.v1/condition/weakened) (save ends).\n\n**[Power Roll](scc.v1:mcdm.heroes.v1/rule.dice/power-roll) + [Presence](scc.v1:mcdm.heroes.v1/rule.character/presence):**\n\n- **≤11:** 8 + P psychic damage\n- **12-16:** 13 + P psychic damage\n- **17+:** 17 + P psychic damage"
