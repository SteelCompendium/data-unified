content: |-
    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with the [legacy](scc.v1:mcdm.heroes.v1/negotiation/legacy) [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) desires fame while alive and acclaim that lasts long after their death. They hope others will know and remember their deeds, great or terrible. Some of these [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) might even seek immortality through deification or undeath, so that the eventual shedding of their mortal coil doesn't prevent them from continuing to make history.

    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with a [legacy](scc.v1:mcdm.heroes.v1/negotiation/legacy) [pitfall](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) cares nothing about leaving a personal mark on the world. To them, such vain thinking is nothing but a waste of time.

    Arguments that appeal to a [legacy](scc.v1:mcdm.heroes.v1/negotiation/legacy) [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) contend that striking a deal with the heroes increases the likelihood that people will talk about the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) for centuries to come. Example arguments include the following:

    - "If you give us the vizier's itinerary, I'll compose a song about your bravery in defying him, then sing it in every tavern from here to Ix!"
    - "Yes, losing the battle is a possibility. If we do, the gnolls will still come for you eventually. But if we crush our foes, imagine the honors, the histories, the poems, the statues—all of it created for you because your siege engines turned the tide."
name: Legacy
scc: mcdm.heroes.v1/negotiation/legacy
type: negotiation
