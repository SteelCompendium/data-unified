content: |-
    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with the [power](scc.v1:mcdm.heroes.v1/negotiation/power) [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) covets the authority of others. They want to increase their influence, no matter how great it already is, and maintain their domain. They might seek power through conquering others, the collection of artifacts, or through the infusion of [supernatural](scc.v1:mcdm.heroes.v1/rule.general/supernatural) rituals—though why choose one method when all three together achieve the best results? Some such [NPCs](scc.v1:mcdm.heroes.v1/rule.general/npc) are world-traversing tyrants, but the petty administrators of village organizations and shrines can covet power just as hungrily.

    An [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc) with the [power](scc.v1:mcdm.heroes.v1/negotiation/power) [pitfall](scc.v1:mcdm.heroes.v1/rule.negotiation/pitfall) has no [interest](scc.v1:mcdm.heroes.v1/rule.negotiation/interest) in authority for themself. They might respect the authority of others, but they hate the thought of ruling over other people and roundly reject any suggestion of the idea.

    Arguments that appeal to a power [motivation](scc.v1:mcdm.heroes.v1/rule.negotiation/motivation) contend that working with the heroes will increase or protect the [NPC](scc.v1:mcdm.heroes.v1/rule.general/npc)'s power. Example arguments include the following:

    - "Everyone knows you should be running the watch, Percy. The old lady's retiring, and our friend Baron Kuglar is naming the replacement. Now, you let us into the restricted armory, and we'll put in a good word."
    - "We know he's your brother, Your Highness, but he's older—first in line for the throne. If you help us prove he's in a cult, you become the favorite son."
name: Power
scc: mcdm.heroes.v1/negotiation/power
type: negotiation
