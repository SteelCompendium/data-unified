average_potency: '[Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) − 1'
content: "Subtlety is your art, the tip of the blade your brush. You studied at a secret college, specializing in alchemy, illusion, or [shadow](scc.v1:mcdm.heroes.v1/class/shadow)-magics. Your training and knowledge place you among the elite ranks of assassins, spies, and commandos. But more potent than any weapon or sorcery is your insight into your enemies' weaknesses.\n\n**As a [shadow](scc.v1:mcdm.heroes.v1/class/shadow), you possess abilities that deal significant damage, enable you to move swiftly across the battlefield and evade hazards, and allow you to fade from notice even in the midst of the most intense combat encounters. You also possess more skills than any other hero.**\n\n> \"Whenever there is doubt, there is no doubt.\" \n>\n> **Motto of the College of Black Ash**\n\n### Basics\n\n**Starting [Characteristics](scc.v1:mcdm.heroes.v1/rule.character/characteristic):** You start with an [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) of 2, and you can choose one of the following arrays for your other [characteristic](scc.v1:mcdm.heroes.v1/rule.character/characteristic) scores:\n\n- 2, 2, −1, −1\n- 2, 1, 1, −1\n- 2, 1, 0, 0\n- 1, 1, 1, 0\n\n**Weak [Potency](scc.v1:mcdm.heroes.v1/rule.character/potency):** [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) − 2\n\n**Average [Potency](scc.v1:mcdm.heroes.v1/rule.character/potency):** [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility) − 1\n\n**Strong [Potency](scc.v1:mcdm.heroes.v1/rule.character/potency):** [Agility](scc.v1:mcdm.heroes.v1/rule.character/agility)\n\n**Starting [Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) at 1st Level:** 18\n\n**[Stamina](scc.v1:mcdm.heroes.v1/rule.health/stamina) Gained at 2nd and Higher Levels:** 6\n\n**[Recoveries](scc.v1:mcdm.heroes.v1/rule.health/recoveries):** 8\n\n**Skills:** You gain the Hide and Sneak skills (see Skills in Chapter 9: [Tests](scc.v1:mcdm.heroes.v1/chapter/tests)). Then choose any five skills from Criminal Underworld or the skills of the [exploration](scc.v1:mcdm.heroes.v1/skill.group/exploration), [interpersonal](scc.v1:mcdm.heroes.v1/skill.group/interpersonal), or [intrigue](scc.v1:mcdm.heroes.v1/skill.group/intrigue) skill groups. (*Quick Build:*  Criminal Underworld, Hide, Lie, Pick Lock, Pick Pocket, Sabotage, Sneak.)\n\n###### Shadow Advancement Table\n\n| Level | Features                                                                                                            | Abilities                 | College Abilities |\n|-------|---------------------------------------------------------------------------------------------------------------------|---------------------------|-------------------|\n| 1st   | [Shadow College](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/shadow-college), [Insight](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/insight), [College Features](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/1st-level-college-features), [College Triggered Action](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/college-triggered-action), [Hesitation Is Weakness](scc.v1:mcdm.heroes.v1/feature.ability.shadow.level-1/hesitation-is-weakness), [Kit](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/kit), [Shadow Abilities](scc.v1:mcdm.heroes.v1/feature.shadow.level-1/shadow-abilities)  | Signature, 3, 5           | -                 |\n| 2nd   | [College Feature](scc.v1:mcdm.heroes.v1/feature.shadow.level-2/2nd-level-college-feature), [Perk](scc.v1:mcdm.heroes.v1/feature.shadow.level-2/perk), [College Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-2/2nd-level-college-ability)                                                                              | Signature, 3, 5           | 5                 |\n| 3rd   | [Careful Observation](scc.v1:mcdm.heroes.v1/feature.ability.shadow.level-3/careful-observation), [7-Insight Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-3/7-insight-ability)                                                                              | Signature, 3, 5, 7        | 5                 |\n| 4th   | [Characteristic Increase](scc.v1:mcdm.heroes.v1/feature.shadow.level-4/characteristic-increase), [Keep It Down](scc.v1:mcdm.heroes.v1/feature.shadow.level-4/keep-it-down), [Night Watch](scc.v1:mcdm.heroes.v1/feature.ability.shadow.level-4/night-watch), [Perk](scc.v1:mcdm.heroes.v1/feature.shadow.level-4/perk), [Skill](scc.v1:mcdm.heroes.v1/feature.shadow.level-4/skill), [Surge of Insight](scc.v1:mcdm.heroes.v1/feature.shadow.level-4/surge-of-insight)                                   | Signature, 3, 5, 7        | 5                 |\n| 5th   | [College Feature](scc.v1:mcdm.heroes.v1/feature.shadow.level-5/5th-level-college-feature), [9-Insight Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-5/9-insight-ability)                                                                                  | Signature, 3, 5, 7, 9     | 5                 |\n| 6th   | [Perk](scc.v1:mcdm.heroes.v1/feature.shadow.level-6/perk), [Umbral Form](scc.v1:mcdm.heroes.v1/feature.shadow.level-6/umbral-form), [College Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-6/6th-level-college-ability)                                                                                  | Signature, 3, 5, 7, 9     | 5, 9              |\n| 7th   | [Characteristic Increase](scc.v1:mcdm.heroes.v1/feature.shadow.level-7/characteristic-increase), [Keen Insight](scc.v1:mcdm.heroes.v1/feature.shadow.level-7/keen-insight), [Skill](scc.v1:mcdm.heroes.v1/feature.shadow.level-7/skill), [Careful Observation Improvement](scc.v1:mcdm.heroes.v1/feature.shadow.level-7/careful-observation-improvement), [Ventriloquist](scc.v1:mcdm.heroes.v1/feature.shadow.level-7/ventriloquist)                        | Signature, 3, 5, 7, 9     | 5, 9              |\n| 8th   | [College Feature](scc.v1:mcdm.heroes.v1/feature.shadow.level-8/8th-level-college-feature), [Perk](scc.v1:mcdm.heroes.v1/feature.shadow.level-8/perk), [11-Insight Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-8/11-insight-ability)                                                                           | Signature, 3, 5, 7, 9, 11 | 5, 9              |\n| 9th   | [Gloom Squad](scc.v1:mcdm.heroes.v1/feature.shadow.level-9/gloom-squad), [College Ability](scc.v1:mcdm.heroes.v1/feature.shadow.level-9/9th-level-college-ability)                                                                                        | Signature, 3, 5, 7, 9, 11 | 5, 9, 11          |\n| 10th  | [Characteristic Increase](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/characteristic-increase), [Death Pool](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/death-pool), [Perk](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/perk), [Skill](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/skill), [Careful Observation Improvement](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/careful-observation-improvement), [Improved Umbral Form](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/improved-umbral-form), [Subterfuge](scc.v1:mcdm.heroes.v1/feature.shadow.level-10/subterfuge) | Signature, 3, 5, 7, 9, 11 | 5, 9, 11          |"
